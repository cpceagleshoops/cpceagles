<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Nest · CPC Eagles Basketball</title>
<meta name="description" content="Cedar Park Christian varsity basketball: schedule, scouting, playbook and stats.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Nest">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
/* One committed dark world: deep school navy surfaces, gold accents. Desktop: left rail. Phone: top bar + bottom tab bar, sheets slide up. */
:root{
  --navy:#1c3045; --gold:#ab8c59; --gold-2:#c2b08a; --gold-ink:#d6c299; --slate:#3b596b;
  --bg:#0b1522; --surface:#122033; --surface-2:#182a41; --surface-3:#203653; --line:#22385a;
  --ink:#eef2f7; --muted:#9aacc1; --accent-text:#d6c299;
  --good:#4cc08b; --bad:#e8836b; --warn:#e5b45a;
  --good-bg:rgba(76,192,139,.14); --bad-bg:rgba(232,131,107,.14); --warn-bg:rgba(229,180,90,.14); --gold-bg:rgba(171,140,89,.16);
  --court:#0a1420; --court-line:rgba(194,176,138,.55); --court-paint:rgba(171,140,89,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Program levels: one color each, used wherever a level shows */
  --lv-v:#d4b26e; --lv-jv:#6fa8dc; --lv-c:#c9d1db; --lv-all:#5cc4b4; --lv-staff:#a596c4;
  --lv-v-bg:rgba(212,178,110,.16); --lv-jv-bg:rgba(111,168,220,.16); --lv-c-bg:rgba(201,209,219,.14); --lv-all-bg:rgba(92,196,180,.15); --lv-staff-bg:rgba(165,150,196,.16);
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 85% -120px,rgba(171,140,89,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.025em;font-weight:700}
h2{font-size:20px} h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}


.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100% - 26px)}
.rail{background:linear-gradient(180deg,#0f1c2e,#0b1624);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 6px;text-decoration:none}
.brand .t1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;color:#fff;line-height:1}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:#cfd8e3;font-weight:500;font-size:14px;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--gold-bg);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
.nav a.on .ic{color:var(--gold-2)}
.ic{width:18px;height:18px;flex:none;color:var(--muted)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:8px}
.me .who{font-weight:600;color:#fff;font-size:13.5px}
.me .role{font-size:11.5px;color:var(--gold-2)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--good)}
.topbar,.tabbar{display:none}

main{padding:22px clamp(16px,2.6vw,34px) 60px;max-width:1180px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section{margin-top:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel+.panel{margin-top:10px}
.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary h2{font-size:19px}
.panel>summary .sum{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.chev{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .2s}
.panel[open]>summary .chev{transform:rotate(90deg)}
.panel[open]>summary{border-bottom:1px solid var(--line)}
.pbody{padding:14px 16px 16px}
.ptools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel.keys{border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(171,140,89,.16),rgba(171,140,89,.05))}
.keys ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:600}

.hero{background:linear-gradient(135deg,#16283f 0%,#1c3045 50%,#2a4762 100%);color:#fff;border:1px solid rgba(194,176,138,.22);position:relative;overflow:hidden;padding:20px}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(194,176,138,.10)}
.hero .eyebrow{color:var(--gold-2)}
.hero h2{font-size:32px;margin:4px 0 2px;text-transform:uppercase;font-weight:700}
.hero .meta{color:#c9d4df;font-size:13.5px}
.hero .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:baseline;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:12px;color:#c9d4df;margin-top:10px;margin-right:6px;position:relative;z-index:1}
.pill b{font-family:var(--display);font-size:17px;color:#fff}

.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 10px}
.kv .k,.tile .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-family:var(--display);font-size:25px;font-weight:600;line-height:1.1}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s;min-height:36px}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#101a27}
.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn.danger{color:var(--bad);border-color:rgba(232,131,107,.4);background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;min-height:30px}
.btn.icon{padding:0;width:36px;height:36px}
.btn.edit{background:transparent;border-color:rgba(194,176,138,.35);color:var(--gold-ink)}
.btn.edit svg{width:13px;height:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.gold{background:var(--gold-bg);color:var(--accent-text)}
.chip.verified::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.res{font-family:var(--display);font-weight:700;font-size:16px;width:22px;display:inline-block}
.res.W{color:var(--good)} .res.L{color:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .date{font-family:var(--display);font-size:13px;line-height:1.05;color:var(--muted);text-transform:uppercase}
.li .date b{display:block;font-size:22px;color:var(--ink);font-weight:600}
.li .opp{font-weight:600;text-decoration:none}
.li a.opp:hover{color:var(--accent-text)}
.li .right{display:flex;align-items:center;gap:8px}
.upnext{background:var(--gold-bg);border-radius:10px;border-top-color:transparent!important;padding-left:8px;padding-right:8px}
.upnext+.li{border-top-color:transparent}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2);cursor:pointer;user-select:none}
th.nosort{cursor:default} th.sorted{color:var(--accent-text)}
td:first-child,th:first-child,td.l,th.l{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
tr.me-row{background:var(--gold-bg)!important}
td.us{font-weight:700}

.pcard{display:flex;gap:12px;align-items:center;text-decoration:none;padding:12px 14px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
a.pcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.pcard::after{content:attr(data-no);position:absolute;right:-4px;bottom:-26px;font-family:var(--display);font-size:92px;font-weight:700;color:var(--gold-2);opacity:.08;pointer-events:none}
.jersey{font-family:var(--display);font-size:32px;font-weight:700;color:var(--accent-text);width:46px;text-align:center;line-height:1;flex:none}
.pname{font-weight:700;font-size:14.5px}
.pline{font-size:12.5px;color:var(--muted)}
.phero{background:linear-gradient(135deg,#132338 0%,#1c3045 45%,#2c4a66 100%);border:1px solid rgba(194,176,138,.22);color:#fff;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phero .pnum{position:absolute;right:18px;top:-38px;font-family:var(--display);font-size:230px;font-weight:700;color:rgba(194,176,138,.13);line-height:1;pointer-events:none}
.phero .eyebrow{color:var(--gold-2)}
.phero h1{color:#fff;font-size:42px;margin:4px 0 12px;position:relative}
.phero .tools{position:absolute;right:16px;top:16px;z-index:2;gap:6px}
@media (max-width:820px){.phero .tools{position:relative;right:auto;top:auto;margin-bottom:12px}}
.bigstats{display:flex;gap:26px;flex-wrap:wrap;position:relative}
.bigstats b{display:block;font-family:var(--display);font-size:38px;font-weight:600;line-height:1}
.bigstats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b9c6d3}

.scheme{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:14px;margin:0}
.scheme dt{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.scheme dd{margin:0}
.oplayer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.oplayer .top{display:flex;gap:10px;align-items:baseline}
.oplayer .jersey{font-size:26px;width:auto;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statline{display:flex;gap:14px;margin:6px 0;font-size:12px;color:var(--muted)}
.statline b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);font-weight:600;line-height:1}
.tend{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.note{border-top:1px solid var(--line);padding:10px 2px;display:flex;flex-direction:column;gap:3px}
.note:first-child{border-top:none;padding-top:0}
.note .by{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note .by b{color:var(--ink)}
.note .by .btn{margin-left:auto}
.note p{margin:0;white-space:pre-wrap}
.clip{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.clip:first-child{border-top:none;padding-top:0}
.playic{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;flex:none;border:1px solid rgba(194,176,138,.3)}
.ts{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent-text)}
.oppcard{text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.oppcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.oppcard h3{font-size:22px;text-transform:uppercase}
.post{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:none;padding-top:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;border:1px solid rgba(194,176,138,.3)}
.post p{margin:2px 0 0;white-space:pre-wrap}

.form{display:flex;flex-direction:column;gap:11px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
label.check input{width:20px;height:20px;accent-color:var(--gold)}
input[type=text],input[type=search],input[type=url],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;width:100%;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(171,140,89,.2)}
.hint{font-size:11.5px;color:var(--muted);font-weight:500}
div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.sheet .seg{display:flex}.sheet .seg button{flex:1;font-size:13.5px;min-height:38px}
.tba{margin-top:4px;font-size:13px}
input:disabled{opacity:.45}
.check.off{opacity:.55}
.totrow td{font-weight:700;border-top:2px solid var(--line)}
.meet{padding:8px 0;border-top:1px solid var(--line)}.meet:first-child{border-top:none;padding-top:0}
.meet .row{gap:8px}.ts-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.morep{margin-top:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:30px}
.seg button.on{background:var(--surface-3);color:#fff}

/* Sheet (edit dialogs) */
.sheet-back{position:fixed;inset:0;background:rgba(4,9,16,.6);backdrop-filter:blur(2px);z-index:60;animation:fadein .15s ease}
.sheet{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px;text-transform:uppercase}
.sheet-body{padding:16px 18px;overflow:auto}
.sheet-foot{display:flex;gap:8px;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);align-items:center}
.sheet-foot .grow{flex:1}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-20px);background:#0f2a1f;border:1px solid rgba(76,192,139,.5);color:#d8f5e7;padding:10px 16px 10px 12px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#3a1d17;border-color:rgba(232,131,107,.5);color:#ffe2da}
.toast .tick{width:22px;height:22px;border-radius:50%;background:var(--good);color:#0b1522;display:grid;place-items:center;flex:none}
.toast.err .tick{background:var(--bad)}

/* Login */
.login{min-height:100%;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(32px + var(--safe-t)) 18px calc(32px + var(--safe-b));background:radial-gradient(900px 520px at 85% -10%,rgba(171,140,89,.22),transparent 60%),linear-gradient(160deg,#0d1a2c,#1c3045 55%,#22405c)}
.loginbox{width:min(400px,100%);color:#fff}
.loginbox h1{font-size:42px;margin:16px 0 4px;color:#fff}
.loginbox p.lead{color:#c3cfdb;margin:0 0 22px}
.loginform{background:rgba(10,20,32,.45);border:1px solid rgba(194,176,138,.25);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.loginform label.f{color:#c3cfdb}
.loginerr{color:#f2b7a8;font-size:13px;min-height:1em}
.fine{margin-top:16px;font-size:12px;color:#9fb0c2}
.pp-only{display:none}
.loginform .lgseg{display:flex;background:rgba(0,0,0,.28);border-color:rgba(194,176,138,.3)}.loginform .lgseg button{flex:1;min-height:44px;font-size:14px;color:#c3cfdb}.loginform .lgseg button.on{background:rgba(194,176,138,.28);color:#fff}
.loginform .lgh{font-size:22px;color:#fff;text-transform:none}.loginform .lgp{margin:0;color:#c3cfdb}
.lglinks{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px}.lglinks .linkbtn{font-size:13px;min-height:44px;text-align:left}
/* Admin: staff & change log */
.staffrow,.logrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 4px;border-top:1px solid var(--line)}
.staffrow:first-child,.logrow:first-child{border-top:none}
.staffrow .who2,.logrow .what{flex:1 1 220px;min-width:0}
.staffrow .em{overflow-wrap:anywhere}

const pwField=(id,label,ac)=>`<label class="f pw" for="${id}">${label}<input type="password" id="${id}" autocomplete="${ac}" required><button type="button" class="eye" data-eye="${id}" aria-label="Show password" aria-pressed="false">${EYE}</button></label>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-eye]");if(!b)return;e.preventDefault();const i=document.getElementById(b.dataset.eye);if(!i)return;const show=i.type==="password";i.type=show?"text":"password";b.setAttribute("aria-pressed",show);b.setAttribute("aria-label",show?"Hide password":"Show password");i.focus()});
async function hashPw(pw,salt){const data=new TextEncoder().encode(salt+":"+pw);const buf=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function setPassword(username,pw){const salt=newSalt();await saveDoc("accounts",username,{salt,hash:await hashPw(pw,salt),setAt:Date.now()})}
const findAccount=u=>u==="coach"?{kind:"coach"}:u==="player"?{kind:"player"}:null;
const liveAcct=u=>store.accounts[u]&&!store.accounts[u].deleted?store.accounts[u]:null;
let loginStage={step:"signin"},fails=0,lockUntil=0;
/* The login screen opens on the tab (Player/Coach) this device used last */
const LOGIN_TAB="cpc_login_tab";const lastTab=()=>{try{return localStorage.getItem(LOGIN_TAB)==="coach"?"coach":"player"}catch(e){return"player"}};const keepTab=u=>{try{localStorage.setItem(LOGIN_TAB,u==="coach"?"coach":"player")}catch(e){}};
function loginView(){
  if(SB)return sbLoginView();
  const st=loginStage;if(!st.u)st.u=lastTab();
  const body=st.step==="create"?`<p class="small" style="margin:0;color:#c3cfdb"><b style="color:#fff">First-time setup.</b> Create the two team passwords. Coaches use the coach password; the team uses the team password.</p>${pwField("lg-new","Coach password (at least "+CONFIG.minPassword.coach+" characters)","new-password")}${pwField("lg-new2","Coach password again","new-password")}${pwField("lg-pl","Team password (at least "+CONFIG.minPassword.player+" characters)","new-password")}<div class="loginerr" id="lg-err" aria-live="polite"></div><button class="btn gold" type="submit">Save passwords and sign in</button><button class="btn" type="button" id="lg-back">Back</button>`
   :`<label class="f" for="lg-user">Login<select id="lg-user" autocomplete="username"><option value="player" ${st.u==="coach"?"":"selected"}>Team</option><option value="coach" ${st.u==="coach"?"selected":""}>Coach</option></select></label>${pwField("lg-pass","Password","current-password")}<div class="loginerr" id="lg-err" aria-live="polite"></div><button class="btn gold" type="submit">Sign in</button>`;
  return `<div class="login"><div class="loginbox">${MARK(84)}<h1>The Nest</h1><p class="lead">${esc(CONFIG.school)} · ${esc(CONFIG.campus)} · ${CONFIG.level.split(" · ").map(x=>`<span class="nw">${esc(x)}</span>`).join(" · ")}</p>
  <form class="loginform" id="loginform" autocomplete="on" novalidate>${body}</form>
  <p class="fine">Players: get the team password from your coach.${SB?"":" Coaches can change both passwords anytime."}</p></div></div>`;
}
function bindLogin(){
  if(SB)return bindSbLogin();
  const err=m=>{const e=$("#lg-err");if(e)e.textContent=m};
  const finish=a=>{keepTab(a.kind);fails=0;user=a.kind==="coach"?{role:"coach",cid:"coach"}:{role:"player"};LS.set(CONFIG.sessionKey,user);loginStage={step:"signin"};location.hash="home";render();toast(a.kind==="coach"?"Signed in as a coach":"Signed in. Go Eagles!")};
  const back=$("#lg-back");if(back)back.onclick=()=>{loginStage={step:"signin",u:loginStage.u};render()};
  $("#loginform").onsubmit=async e=>{e.preventDefault();
    if(loginStage.step==="create"){const p1=$("#lg-new").value,p2=$("#lg-new2").value,pl=$("#lg-pl").value;
      if(p1.length<CONFIG.minPassword.coach)return err(`The coach password needs at least ${CONFIG.minPassword.coach} characters.`);if(p1!==p2)return err("The two coach passwords don't match.");
      if(pl.length<CONFIG.minPassword.player)return err(`The team password needs at least ${CONFIG.minPassword.player} characters.`);if(pl===p1)return err("Use a different password for players.");
      if(liveAcct("coach"))return err("Passwords were already set up. Go back and sign in.");
      await setPassword("coach",p1);await setPassword("player",pl);return finish({kind:"coach"})}
    if(Date.now()<lockUntil)return err(`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`);
    const u=$("#lg-user").value,pw=$("#lg-pass").value;
    const a=findAccount(u);const acct=liveAcct(u);
    if(!liveAcct("coach")){if(u==="coach"){loginStage={step:"create",u};render();setTimeout(()=>$("#lg-new")&&$("#lg-new").focus(),30);return}return err("The site isn't set up yet. Ask your coach for the team password.")}
    if(a&&!acct)return err("The team password hasn't been set yet. Ask your coach.");
    if(!pw)return err("Enter your password.");
    if(a&&acct&&await hashPw(pw,acct.salt)===acct.hash)return finish(a);
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}
    err("That password isn't right.");$("#lg-pass").value="";$("#lg-pass").focus()};
}

/* ---------- Live-site login: shared player password, personal coach accounts ---------- */
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const COACH_MIN=Math.max(8,CONFIG.minPassword.coach);
const emailField=(v)=>`<label class="f" for="lg-email">Email<input type="email" id="lg-email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required value="${esc(v||"")}"></label>`;
function sbLoginView(){
  const st=loginStage;if(!st.u)st.u=lastTab();const errBox=`<div class="loginerr" id="lg-err" aria-live="polite">${esc(st.msg||"")}</div>`;

  if(st.step==="newpw"){body=`<h2 class="lgh">Set a new password</h2><p class="small lgp">Pick a new password for your coach account.</p>${pwField("lg-new",`New password (at least ${COACH_MIN} characters)`,"new-password")}${pwField("lg-new2","New password again","new-password")}${errBox}<button class="btn gold" type="submit">Save password</button><button class="btn" type="button" id="lg-cancel">Cancel</button>`;fine=""}
  else if(st.step==="signup"){body=`<h2 class="lgh">Create your coach account</h2><p class="small lgp">The site admin approves new coach accounts.</p><label class="f" for="lg-name">Your name<input type="text" id="lg-name" autocomplete="name" maxlength="60" required value="${esc(st.name||"")}"></label>${emailField(st.email)}${pwField("lg-new",`Password (at least ${COACH_MIN} characters)`,"new-password")}${pwField("lg-new2","Password again","new-password")}${errBox}${st.existing?`<button class="btn gold" type="button" id="lg-instead">Sign in instead</button>`:""}<button class="btn ${st.existing?"":"gold"}" type="submit">Create account</button>${back}`;fine=""}
  else if(st.step==="forgot"){body=`<h2 class="lgh">Reset your password</h2><p class="small lgp">Enter your coach email. We'll send a link to set a new password.</p>${emailField(st.email)}${errBox}<button class="btn gold" type="submit">Send reset link</button>${back}`;fine=""}
  else if(st.step==="requested"){body=`<h2 class="lgh">Request sent</h2><p class="lgp" role="status">Thanks${st.first?", "+esc(st.first):""}! Your request is with the site admin. Once they approve it, sign in here with the same email and password.</p><button class="btn gold" type="button" id="lg-back">Back to sign in</button>`;fine=""}
  else if(st.step==="sent"){body=`<h2 class="lgh">${esc(st.head||"Check your email")}</h2><p class="lgp" role="status">${esc(st.note)}</p><button class="btn gold" type="button" id="lg-back">Back to sign in</button>`;fine=""}
  else{const coach=st.u==="coach";
    body=`<div class="seg lgseg" role="group" aria-label="Sign in as"><button type="button" data-lgu="player" class="${coach?"":"on"}" aria-pressed="${!coach}">Team</button><button type="button" data-lgu="coach" class="${coach?"on":""}" aria-pressed="${coach}">Coach</button></div>
    ${coach?emailField(st.email):""}${pwField("lg-pass","Password","current-password")}${errBox}<button class="btn gold" type="submit">Sign in</button>
    ${coach?`<div class="lglinks"><button type="button" class="linkbtn" id="lg-signup">First time? Create your coach account</button><button type="button" class="linkbtn" id="lg-forgot">Forgot password?</button></div>`:""}`;
    if(coach)fine="Coaches: create your account once. The site admin approves it."}
  return `<div class="login"><div class="loginbox">${MARK(84)}<h1>The Nest</h1><p class="lead">${esc(CONFIG.school)} · ${esc(CONFIG.campus)} · ${CONFIG.level.split(" · ").map(x=>`<span class="nw">${esc(x)}</span>`).join(" · ")}</p>
  <form class="loginform" id="loginform" autocomplete="on" novalidate>${body}</form>${fine?`<p class="fine">${fine}</p>`:""}</div></div>`;
}
function sbAuthErr(e,coach){const st=e&&e.status,c=(e&&e.code)||"",m=String((e&&e.message)||"");
  if(c==="email_not_confirmed"||/not confirmed/i.test(m))return"Confirm your email first. Open the link we emailed you, then sign in.";
  if(st===429||/^over_.*rate_limit$/.test(c)||/rate limit|too many/i.test(m))return RATE_MSG;
  if(c==="invalid_credentials"||/invalid login/i.test(m))return coach?"That email or password isn't right.":"That password isn't right.";
  return"Couldn't sign in right now. Try again in a minute."}
const badCreds=e=>!!e&&(e.code==="invalid_credentials"||/invalid login credentials/i.test(String(e.message||"")));
function sbSignupErr(e){const m=String((e&&e.message)||""),c=(e&&e.code)||"";
  if(c==="user_already_exists"||c==="email_exists"||/already registered|already exists|user exists/i.test(m))return["This email already has an account. Tap Sign in instead.",true];
  if(e&&e.status===429||/^over_.*rate_limit$/.test(c)||/rate limit/i.test(m))return[RATE_MSG];
  if(c==="signup_disabled"||/signups? (are )?(not allowed|disabled)/i.test(m))return["New accounts are turned off right now. Ask the site admin."];
  if(c==="weak_password"||/password/i.test(m)&&/weak|short|at least|characters/i.test(m))return[`That password is too weak. Use at least ${COACH_MIN} characters, mixing letters and numbers.`];
  if(c==="email_address_invalid"||c==="validation_failed"&&/email/i.test(m)||/invalid email|unable to validate email|email address .* invalid/i.test(m))return["That email address doesn't look right. Check it and try again."];
  if(c==="email_not_confirmed"||/not confirmed/i.test(m))return["This email already has an account. Confirm it from the link we emailed, then sign in.",true];
  return["Couldn't create the account right now. Try again in a minute."]}
function sbEnter(u){keepTab(u.role==="player"?"player":"coach");fails=0;sbRecovery=false;user=u;loginStage={step:"signin"};location.hash="home";render();toast(u.role==="admin"?"Signed in as admin":u.role==="coach"?"Signed in as a coach":"Signed in. Go Eagles!");sbLoad()}
/* After any sign-in: staff check. Not on the list (or deactivated) → sign out and say so. */
async function sbAfterSignIn(sess,email,typedName){let u;
  try{u=await sbResolve(sess)}catch(x){try{await SB.auth.signOut({scope:"local"})}catch(e){}loginStage={step:"signin",u:"coach",email,msg:"Couldn't check your coach access. Try again in a minute."};render();return false}
  if(!u||u.role==="none"){const ok=u?await sbNoRole(sess,email||u.email,typedName):null;if(ok){sbEnter(ok);return true}if(!u){loginStage={step:"signin",u:"coach",email,msg:NOT_STAFF};try{await SB.auth.signOut({scope:"local"})}catch(e){}}render();return false}
  sbEnter(u);return true}
function bindSbLogin(){
  const err=m=>{const e=$("#lg-err");if(e)e.textContent=m};
  const em=()=>{const i=$("#lg-email");return i?i.value.trim().toLowerCase():""};
  const go=(st)=>{loginStage=st;render();setTimeout(()=>{const f=$("#loginform input:not([type=hidden])");if(f&&window.innerWidth>820)f.focus()},30)};
  $$("[data-lgu]").forEach(b=>b.onclick=()=>{keepTab(b.dataset.lgu);if(loginStage.u===b.dataset.lgu)return;go({step:"signin",u:b.dataset.lgu,email:em()||loginStage.email})});
  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  on("lg-signup",()=>go({step:"signup",u:"coach",email:em()}));
  on("lg-forgot",()=>go({step:"forgot",u:"coach",email:em()}));
  on("lg-instead",()=>go({step:"signin",u:"coach",email:em()||loginStage.email}));
  on("lg-back",()=>go({step:"signin",u:"coach",email:em()||loginStage.email}));
  on("lg-cancel",async()=>{sbRecovery=false;loginStage={step:"signin",u:"coach"};try{await SB.auth.signOut({scope:"local"})}catch(e){}render()});
  $("#loginform").onsubmit=async e=>{e.preventDefault();const st=loginStage;const btn=$("#loginform button[type=submit]");if(!btn||btn.disabled)return;
    const busy=async f=>{btn.disabled=true;err("");try{await f()}finally{if(btn.isConnected)btn.disabled=false}};
    if(st.step==="newpw"){const p1=$("#lg-new").value,p2=$("#lg-new2").value;
      if(p1.length<COACH_MIN)return err(`Use at least ${COACH_MIN} characters.`);if(p1!==p2)return err("The two passwords don't match.");
      return busy(async()=>{let r;try{r=await SB.auth.updateUser({password:p1})}catch(x){r={error:x}}
        if(r.error){const m=String(r.error.message||"");if(/session|expired|jwt/i.test(m)){sbRecovery=false;return go({step:"forgot",u:"coach",msg:"That reset link has expired. Send yourself a new one."})}
          return err(/different from the old/i.test(m)?"Pick a password you haven't used before.":/weak|short|characters/i.test(m)?"That password is too weak. Try a longer one.":"Couldn't save the password: "+m)}
        let sess=null;try{const {data}=await SB.auth.getSession();sess=data&&data.session}catch(x){}
        sbRecovery=false;if(await sbAfterSignIn(sess,"",null))toast("Password updated. You're signed in.")})}
    if(st.step==="signup"){const nm=($("#lg-name").value||"").replace(/\s+/g," ").trim(),e1=em(),p1=$("#lg-new").value,p2=$("#lg-new2").value;
      if(!nm)return err("Enter your name.");if(nm.length>60)return err("Use 60 characters or fewer for your name.");
      if(!EMAIL_RE.test(e1))return err("Enter a valid email address.");if(p1.length<COACH_MIN)return err(`The password needs at least ${COACH_MIN} characters.`);if(p1!==p2)return err("The two passwords don't match.");
      const exists=m=>{loginStage={step:"signup",u:"coach",email:e1,name:nm,existing:true,msg:m};render()};
      return busy(async()=>{let r;try{r=await SB.auth.signUp({email:e1,password:p1,options:{emailRedirectTo:location.origin+location.pathname,data:{name:nm}}})}catch(x){r={error:x}}
        if(r.error){const [m,ex]=sbSignupErr(r.error);return ex?exists(m):err(m)}
        const d=r.data||{};
        if(d.session)return sbAfterSignIn(d.session,e1,nm);
        if(d.user&&Array.isArray(d.user.identities)&&d.user.identities.length===0)return exists("This email already has an account. Tap Sign in instead.");
        go({step:"sent",u:"coach",email:e1,head:"Check your email",note:"Check your email to confirm, then sign in."})})}
    if(st.step==="forgot"){const e1=em();if(!EMAIL_RE.test(e1))return err("Enter a valid email address.");
      return busy(async()=>{let r;try{r=await SB.auth.resetPasswordForEmail(e1,{redirectTo:location.origin+location.pathname})}catch(x){r={error:x}}
        if(r.error){const m=String(r.error.message||"");return err(r.error.status===429||/rate limit/i.test(m)?RATE_MSG:"Couldn't send the link right now. Try again in a minute.")}
        go({step:"sent",u:"coach",email:e1,head:"Check your email",note:"If that email has a coach account, a link to set a new password is on its way. Open it on this device."})})}
    if(st.step==="sent")return;
    if(Date.now()<lockUntil)return err(`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`);
    const coach=st.u==="coach",pw=$("#lg-pass").value,e1=coach?em():CONFIG.supabase.playerEmail;
    if(coach&&!EMAIL_RE.test(e1))return err("Enter your email address.");if(!pw)return err("Enter your password.");
    return busy(async()=>{let res;try{res=await SB.auth.signInWithPassword({email:e1,password:pw})}catch(x){res={error:x}}
      if(res.error||!res.data||!res.data.session){const er=res.error||{};if(badCreds(er)){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}}err(sbAuthErr(er,coach));const p=$("#lg-pass");if(p){p.value="";p.focus()}return}
      fails=0;if(!coach&&String(res.data.session.user.email||"").toLowerCase()===CONFIG.supabase.playerEmail)return sbEnter({role:"player",email:e1});
      return sbAfterSignIn(res.data.session,e1,null)})};
}

function splitRow(line,del){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"'&&cur.trim()==="")q=true;else if(c===del){out.push(cur.trim());cur=""}else cur+=c}out.push(cur.trim());return out}
function csvDate(s){s=String(s||"").trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s),y,mo,d;if(m){y=+m[1];mo=+m[2];d=+m[3]}else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})$/.exec(s))){mo=+m[1];d=+m[2];y=+m[3]+(m[3].length===2?2000:0)}else return null;
  const iso=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");return realDate(iso)?iso:null}
function parseCSV(text){
  const L=String(text||"").replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(L.length<2)throw new Error("Add a header row and at least one player row.");
  const del=L[0].includes("\t")?"\t":",";const alias={"#":"no",jersey:"no",number:"no",date:"game"};
  const head=splitRow(L[0],del).map(x=>{x=x.trim().toLowerCase();return alias[x]||x});const miss=["game","no"].filter(n=>!head.includes(n));if(miss.length)throw new Error("Missing column"+(miss.length>1?"s":"")+": "+miss.join(", ")+".");
  const PL=players();const gs={},seen={},bad=new Set(),errs=[],blank=[];
  L.slice(1).forEach((ln,i)=>{const r=i+2;const v=splitRow(ln,del);const o={};head.forEach((h,j)=>o[h]=v[j]??"");
    const date=csvDate(o.game);if(!date){errs.push(`Row ${r}: can't read the date “${o.game}”. Use 11/21/2026 or 2026-11-21.`);return}
    const nice=mon(D(date))+" "+D(date).getDate();const day=games().filter(x=>x.date===date);let g=day[0];
    if(!g){errs.push(`Row ${r}: there's no game on ${nice} on the Game schedule. Add the game first.`);return}
    if(day.length>1){const q=String(o.opp||"").trim().toLowerCase();const m=q?day.filter(x=>O(x.opp).name.toLowerCase()===q||O(x.opp).name.toLowerCase().includes(q)):[];
      if(m.length!==1){errs.push(`Row ${r}: there are ${day.length} games on ${nice} (${day.map(x=>O(x.opp).name).join(", ")}). Add an opp column with the opponent's name.`);return}g=m[0]}
    if(!g.played){errs.push(`Row ${r}: Enter the final score for ${nice} on the Game schedule first.`);return}
    const raw=String(o.no||"").replace(/^#/,"").trim();let p=PL.find(x=>String(x.no)===raw);
    if(!p&&/^\d+$/.test(raw)){const c=PL.filter(x=>/^\d+$/.test(String(x.no))&&+x.no===+raw);if(c.length===1)p=c[0]}
    if(!p){errs.push(`Row ${r}: no player wears #${raw||"(blank)"}.`);return}
    const sg=(seen[g.id]=seen[g.id]||{});if(sg[p.id]){errs.push(`${nice}: ${p.no!=null&&String(p.no)!==""?"#"+p.no:""} ${pName(p)} is listed twice (rows ${sg[p.id]} and ${r}). Fix the file. This game was not imported.`);bad.add(g.id);return}sg[p.id]=r;
    const l={id:p.id};KEYS.forEach(k=>l[k]=Math.max(0,parseInt(o[k],10)||0));
    if(String(o.min??"").trim()===""&&KEYS.some(k=>k!=="min"&&l[k]>0))blank.push(`${p.no!=null&&String(p.no)!==""?"#"+p.no:""} ${pName(p)} (${nice})`);
    (gs[g.id]=gs[g.id]||[]).push(l)});
  bad.forEach(d=>delete gs[d]);
  const warns=blank.length?[`Minutes are blank for ${blank.join(", ")}. Those lines won't count as games played until minutes are entered.`]:[];
  return{games:gs,errs,warns};
}

  notes:"Every pass is followed by a cut, and every open spot gets filled.\nCut in front of your man if he turns his head; back cut if he overplays."},
 {id:"pb-dribble-drive",side:"offense",cat:"Half court",name:"Dribble drive (drive & kick)",court:"half",phases:[
   PH(O5,"1",{cap:"5-out. Stay wide so the driving gaps stay open."}),
   PH([[310,150],[430,210],[250,300],[462,32],[70,205]],"1",{cap:"1 attacks the gap. 3 rotates up to the top behind him; 5 lifts to the wing."}),
   PH([[310,150],[430,210],[250,300],[462,32],[70,205]],"2",{cap:"2's man helps on the drive, so 1 kicks it out to 2."}),
   PH([[38,32],[430,210],[250,300],[462,32],[70,205]],"2",{curve:{1:[190,55]},cap:"1 empties to the open corner. 2 shoots, or attacks the closeout and we drive and kick again."})],
  roles:{1:"Attack the gap hard. Finish, or kick to the shooter whose man helps.",2:"Right wing. Stay wide; catch and shoot or attack the closeout.",3:"Left wing. Rotate up behind the drive to the top (safety and outlet).",4:"Right corner. Stay deep in the corner for the drift pass.",5:"Left corner. Lift to the wing when 3 rotates up."},
  notes:"Drive to score, not to pass. Ball drives at you: move away to an open spot. Ball drives away: fill behind.\nKick to whoever's man helps."},
 {id:"pb-horns-pnr",side:"offense",cat:"Half court",name:"Horns pick-and-roll",court:"half",phases:[
   PH([[250,310],[462,32],[38,32],[168,192],[332,192]],"1",{cap:"Horns: bigs at both elbows, shooters in both corners."}),
   PH([[240,318],[462,32],[38,32],[168,192],[288,290]],"1",{screens:["5"],scrFor:{5:"1"},cap:"5 steps up and sets the ball screen; 1 sets his man up the other way."}),
   PH([[370,225],[462,32],[38,32],[175,295],[275,90]],"1",{curve:{1:[345,355]},cap:"1 comes off tight. 5 rolls to the rim; 4 pops to the top."}),
   PH([[370,225],[462,32],[38,32],[175,295],[268,80]],"5",{cap:"Read the help: 5 on the roll, 4 on the pop, or the corner shooter whose man helps."})],
  roles:{1:"Set your man up, come off the screen shoulder to shoulder, read the big.",2:"Right corner. Spot up; your man may help on the roll.",3:"Left corner. Spot up for the skip pass.",4:"Left elbow. Pop to the top when 5 screens; shoot or swing.",5:"Right elbow. Screen 1's man, then roll hard to the rim with your hands up."},
  notes:"Horns can go either way: the big on the side 1 picks sets the screen.\nIf they switch, attack the mismatch."},
 {id:"pb-spread-pnr",side:"offense",cat:"Half court",name:"Spread pick-and-roll",court:"half",phases:[
   PH([[250,330],[462,32],[38,32],[70,210],[352,80]],"1",{cap:"4-out spacing with 5 on the right block. Corners filled."}),
   PH([[250,330],[462,32],[38,32],[70,210],[290,302]],"1",{screens:["5"],scrFor:{5:"1"},cap:"5 sprints up and sets a high ball screen on 1's right side."}),
   PH([[375,235],[462,32],[38,32],[70,210],[280,90]],"1",{curve:{1:[350,370]},cap:"1 turns the corner. 5 rolls hard to the rim (or pops if his man drops)."}),
   PH([[375,235],[458,38],[38,32],[70,210],[280,90]],"2",{cap:"The corner defender tags the roller, so 1 kicks to 2 for the corner three."})],
  roles:{1:"Wait for the screen, come off tight, attack the big. Hit the open man.",2:"Right corner. Your man has to help on the roll: be ready to shoot.",3:"Left corner. Spot up for the skip pass.",4:"Left wing. Stay spaced; you're the reversal.",5:"Sprint up, screen 1's man, then roll to the rim. Pop if your man drops deep."},
  notes:"Spread the floor so only one defender can help.\nBig drops: pull-up or pop. Big shows: hit the roll. Corner helps: corner three."},
 {id:"pb-flex",side:"offense",cat:"Half court",name:"Flex (flex cut + down screen)",court:"half",phases:[
   PH([[170,290],[330,290],[462,32],[38,32],[150,75]],"1",{cap:"Flex set: 1 and 2 up top, 5 on the left block, 4 and 3 in the corners."}),
   PH([[170,290],[330,290],[462,32],[38,32],[150,75]],"2",{cap:"1 reverses the ball to 2."}),
   PH([[170,290],[330,290],[462,32],[345,78],[150,75]],"2",{screens:["5"],scrFor:{5:"4"},curve:{4:[165,15]},cap:"5 sets the flex screen; 4 cuts baseline off it to the ball-side block. 2 looks inside."}),
   PH([[178,128],[330,290],[462,32],[345,78],[150,75]],"2",{screens:["1"],scrFor:{1:"5"},cap:"1 down screens for 5: screen the screener."}),
   PH([[38,32],[330,290],[462,32],[345,78],[170,290]],"5",{curve:{5:[110,195]},cap:"5 comes up to the top for the reversal; 1 clears to the corner. Same set, other side."})],
  roles:{1:"Reverse the ball, then down screen for 5 and clear to the corner.",2:"Catch the reversal. Look for 4 on the flex cut, then 5 coming up.",3:"Right corner. Stay spaced; you're the next flex cutter when the ball comes back.",4:"Flex cutter. Set your man up, then cut baseline tight off 5's screen.",5:"Flex screener. Screen for 4, then come up off 1's down screen."},
  notes:"Continuity: after each reversal the same pattern runs to the other side.\nScreeners: be still and wide. Cutters: wait for the screen, then cut shoulder to shoulder."},
 {id:"pb-ucla-cut",side:"offense",cat:"Half court",name:"UCLA cut",court:"half",phases:[
   PH([[250,310],[430,210],[70,210],[38,32],[332,192]],"1",{cap:"5 at the right elbow; 2 and 3 on the wings, 4 in the left corner."}),
   PH([[250,310],[430,210],[70,210],[38,32],[332,192]],"2",{cap:"1 passes to 2 on the right wing."}),
   PH([[290,85],[430,210],[70,210],[38,32],[332,192]],"2",{screens:["5"],scrFor:{5:"1"},curve:{1:[310,215]},cap:"5 back screens; 1 makes the UCLA cut off his shoulder to the rim."}),
   PH([[345,80],[430,210],[70,210],[38,32],[250,300]],"2",{cap:"No layup? 1 posts up on the block and 5 pops to the top."}),
   PH([[345,80],[430,210],[70,210],[38,32],[250,300]],"1",{cap:"2 feeds 1 in the post, or swings it to 5 at the top to reverse."})],
  roles:{1:"Pass to the wing, then cut off 5's back screen to the rim. Post up if you're not open.",2:"Right wing. Look for 1 on the cut, then in the post.",3:"Left wing. Spot up for the reversal.",4:"Left corner. Stay spaced and deep.",5:"High post. Back screen for 1, then pop to the top for the ball."},
  notes:"The UCLA cut: a guard cuts off a high-post back screen to the rim.\nCutter: take a step away first, then cut tight off the screener's shoulder."},
 {id:"pb-box-blob",side:"offense",cat:"Out of bounds (BLOB)",name:"Box: screen the screener",court:"half",phases:[
   PH([[168,192],[332,192],[320,-22],[345,75],[155,75]],"3",{cap:"Box: 3 inbounds on the right; bigs on the blocks, guards at the elbows."}),
   PH([[168,192],[332,192],[320,-22],[228,85],[155,75]],"3",{screens:["4"],scrFor:{4:"5"},cap:"On the slap, 4 steps across and screens for 5."}),
   PH([[212,150],[332,192],[320,-22],[228,85],[318,58]],"3",{screens:["1"],scrFor:{1:"4"},curve:{5:[235,12]},cap:"5 cuts under the screen to the rim. 1 down screens for 4: screen the screener."}),
   PH([[212,150],[462,32],[320,-22],[250,205],[318,58]],"3",{curve:{4:[278,140]},cap:"4 comes off 1's screen to the free-throw line; 2 pops to the corner."}),
   PH([[250,330],[462,32],[320,-22],[250,205],[318,58]],"4",{curve:{1:[150,260]},cap:"3 reads it: 5 at the rim, 4 at the line, 2 in the corner. 1 is the safety."})],
  roles:{1:"Left elbow. Down screen for 4 (screen the screener), then get back as the safety.",2:"Right elbow. Pop to the ball-side corner for the shot.",3:"Inbounder. Slap to start. Look 5, then 4, then 2, then 1.",4:"Right block. Cross screen for 5, then use 1's screen to the line.",5:"Left block. Cut under 4's screen to the rim, hands up."},
  notes:"Each screen is set as the last cut starts. Screeners hold until the cutter passes.\nIf everything is covered, 1 is the safe pass."},
 {id:"pb-stack-blob",side:"offense",cat:"Out of bounds (BLOB)",name:"Stack: lob & flash",court:"half",phases:[
   PH([[345,220],[345,175],[320,-22],[345,130],[345,85]],"3",{cap:"Stack on the ball-side lane line: 5 at the bottom, then 4, 2 and 1. 3 inbounds."}),
   PH([[250,300],[462,40],[320,-22],[298,108],[345,85]],"3",{screens:["4"],scrFor:{4:"5"},cap:"On the slap: 1 releases to safety, 2 pops to the corner, 4 turns and screens for 5."}),
   PH([[250,300],[462,40],[320,-22],[298,108],[262,62]],"3",{curve:{5:[290,225]},cap:"5 steps up the lane, then spins back off 4's screen to the rim."}),
   PH([[250,300],[462,40],[320,-22],[352,45],[262,62]],"5",{cap:"3 throws the lob to 5. Covered? 4 flashes to the ball, then 2 in the corner, then 1."})],
  roles:{1:"Top of the stack. Release to the top as the safety.",2:"Pop to the ball-side corner for the shot.",3:"Inbounder. Slap to start; lob to 5 first, then 4, 2, 1.",4:"Turn and screen 5's defender, then flash to the ball.",5:"Bottom of the stack. Step up, then spin to the rim for the lob."},
  notes:"Sell the step-up so 5's defender follows him.\nThrow the lob to the rim side, away from the defender."},
 {id:"pb-line-slob",side:"offense",cat:"Out of bounds (SLOB)",name:"Line: stagger",court:"half",phases:[
   PH([[305,250],[350,250],[488,250],[395,250],[440,250]],"3",{cap:"Line on the right sideline: 5 nearest the ball, then 4, 2 and 1. 3 inbounds."}),
   PH([[250,380],[350,250],[488,250],[358,146],[390,86]],"3",{screens:["4","5"],scrFor:{4:"2",5:"2"},cap:"1 goes long as the safety. 4 and 5 drop and set a stagger toward the corner."}),
   PH([[250,380],[462,35],[488,250],[358,146],[390,86]],"3",{cap:"2 runs off the stagger, tight off both screens, to the corner."}),
   PH([[250,380],[462,35],[488,250],[330,200],[300,65]],"2",{cap:"3 hits 2 for the corner shot. 5 slips to the rim and 4 pops to the elbow."})],
  roles:{1:"Back of the line. Go long as the safety; come back if 3 is in trouble.",2:"Shooter. Step toward the ball, then cut tight off 4 and 5 to the corner.",3:"Inbounder. Hit 2 in the corner; then 5 on the slip, 4 at the elbow, 1 long.",4:"First screener. Screen 2's man, then pop to the elbow.",5:"Second screener. Screen, then slip to the rim."},
  notes:"Screeners: wide and still. The shooter sets his man up first.\nYou have five seconds: 3 counts out loud."},
 {id:"pb-press-break-212",side:"offense",cat:"Press break",name:"2-1-2 press break",court:"full",phases:[
   PH([[150,140],[150,360],[700,90],[-18,300],[440,250]],"4",{cap:"2-1-2: 4 inbounds; 1 and 2 at the free-throw line extended, 5 at half court, 3 deep."}),
   PH([[85,110],[150,360],[700,90],[-18,300],[440,250]],"1",{cap:"1 V-cuts and catches the inbound. Catch, face up and look up the floor."}),
   PH([[85,110],[330,390],[640,90],[60,300],[300,170]],"1",{cap:"4 steps in behind the ball for the reversal. 5 flashes to the middle; 2 runs the far lane, 3 stays deep."}),
   PH([[85,110],[330,390],[640,90],[60,300],[300,170]],"5",{cap:"1 hits 5 in the middle before the trap closes."}),
   PH([[300,120],[700,410],[760,110],[240,280],[300,170]],"3",{cap:"5 turns and passes ahead to 3. 2 fills the far lane; 1 and 4 trail. Attack."})],
  roles:{1:"V-cut and catch the inbound. Look to 5 in the middle first.",2:"Get open for the inbound; if 1 gets it, run the far lane.",3:"Deep. Stay long on the ball side; catch ahead and attack.",4:"Inbounder. Step in behind the ball for the reversal, then trail.",5:"Flash to the middle on time and catch facing up the floor."},
  notes:"Beat the press with passes, not dribbles. Never dribble into a corner.\nTrap coming? Pass before it closes, then go."},
 {id:"pb-numbered-break",side:"offense",cat:"Transition",name:"Numbered break (3 lanes)",court:"full",phases:[
   PH([[180,440],[260,350],[240,110],[95,230],[130,300]],"4",{cap:"Numbered break: 4 rebounds; 1 gets wide on the ball side for the outlet."}),
   PH([[180,440],[520,460],[520,40],[150,240],[470,250]],"1",{cap:"Outlet to 1. 2 and 3 sprint wide in the outside lanes; 5 rim runs down the middle."}),
   PH([[430,290],[790,465],[790,35],[300,250],[850,250]],"1",{cap:"1 pushes it up the middle. 2 and 3 stay wide; 5 beats his man to the rim; 4 trails."}),
   PH([[680,260],[915,470],[915,30],[520,320],[860,300]],"1",{cap:"Wings run to the corners, 5 seals on the block, 4 trails to the top."}),
   PH([[680,260],[915,470],[915,30],[520,320],[860,300]],"5",{cap:"First look: 5 sealing at the rim. Then the corners, then 4 trailing for the three."})],
  roles:{1:"Get the outlet wide, then push it up the middle with your head up.",2:"Right lane. Sprint wide all the way to the corner.",3:"Left lane. Sprint wide all the way to the corner.",4:"Rebound and outlet, then trail the play to the top.",5:"Rim runner. Sprint rim to rim and seal for the layup."},
  notes:"Run the same lanes every time so nobody has to think.\nWide lanes stretch the defense; the rim run makes their big retreat."},
 {id:"pb-four-corners",side:"offense",cat:"Special situations",name:"Delay: four corners",court:"half",phases:[
   PH([[250,280],[455,385],[45,385],[38,32],[462,32]],"1",{cap:"Four corners: four players spread to the corners, 1 in the middle with the ball."}),
   PH([[250,280],[455,385],[45,385],[38,32],[462,32]],"2",{cap:"1 handles and burns clock. If they trap, he passes to an open corner."}),
   PH([[455,385],[250,290],[45,385],[38,32],[462,32]],"2",{curve:{1:[330,230],2:[360,420]},cap:"2 dribbles back to the middle and 1 takes his corner. Keep the floor spread."}),
   PH([[455,385],[250,290],[225,85],[38,32],[462,32]],"2",{cap:"When a defender leaves to trap or help, his man cuts to the rim."}),
   PH([[455,385],[250,290],[225,85],[38,32],[462,32]],"3",{cap:"2 hits 3 for the layup. Take only layups and free throws."})],
  roles:{1:"Middle. Handle it, stay calm, and get it to a corner if trapped.",2:"Top-right corner. Catch, then dribble back to the middle.",3:"Top-left corner. Cut to the rim when your man leaves you.",4:"Left corner. Stay wide; back cut if your man turns his head.",5:"Right corner. Stay wide; back cut if your man turns his head."},
  notes:"Use it to protect a late lead. Take only layups; make them foul.\nEveryone on the floor has to be a good free-throw shooter."},
 /* ---------- DEFENSE ---------- */
 {id:"pb-man-help-side",side:"defense",cat:"Man-to-man",name:"Man-to-man: help side",court:"half",phases:[
   DP([[250,272],[398,192],[102,192],[395,65],[180,90]],[[250,310],[430,210],[70,210],[462,32],[155,80]],"1",{cap:"Ball at the top. X1 on the ball; X2 and X3 deny one pass away; X4 sinks toward the lane."}),
   DP([[295,262],[410,182],[195,165],[435,58],[212,85]],[[250,310],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball on the wing: X2 on the ball. X1 and X4 deny one pass away. X3 and X5 help in the lane."}),
   DP([[270,215],[415,160],[215,135],[440,52],[245,80]],[[250,310],[430,210],[70,210],[462,32],[155,80]],"4",{cap:"Ball in the corner: X4 on the ball, X2 denies the pass back. X5 is the low man at the rim."}),
   DP([[295,262],[410,182],[195,165],[435,58],[212,85]],[[250,310],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball back out: everyone moves while the pass is in the air. Jump to the ball."})],
  roles:{1:"On the ball at the top. Jump to the ball on every pass.",2:"Deny one pass away; take the ball on the wing.",3:"Deny at the top; help in the lane when you're two passes away.",4:"Corner man. Sink toward the lane; deny when the ball comes to your side.",5:"Guard the post. From the help side, be the low man at the rim."},
  notes:"On the ball: pressure. One pass away: deny, hand in the passing lane. Two passes away: help, a foot in the lane.\nSee your man and the ball. Move on the pass, not the catch."},
 {id:"pb-man-closeout-ice",side:"defense",cat:"Man-to-man",name:"Man: closeout & ICE",court:"half",phases:[
   DP([[250,272],[385,195],[110,190],[90,70],[325,72]],[[250,310],[430,210],[70,210],[38,32],[350,80]],"1",{cap:"Ball at the top. X2 is helping in the gap, a long way from his man."}),
   DP([[290,262],[410,192],[190,165],[175,70],[325,72]],[[250,310],[430,210],[70,210],[38,32],[350,80]],"2",{cap:"Pass to 2. X2 closes out: sprint, then short choppy steps, high hand, a stride away."}),
   DP([[290,262],[410,232],[190,165],[175,70],[420,150]],[[250,310],[430,210],[70,210],[38,32],[385,255]],"2",{cap:"5 comes up to screen. ICE: X2 jumps above the screen to take away the middle; X5 drops to the baseline side."}),
   DP([[280,230],[440,170],[190,165],[290,105],[440,110]],[[250,310],[458,135],[70,210],[38,32],[330,130]],"2",{cap:"2 has to go toward the baseline: X5 meets him, X2 rides his hip. X4 tags the roller."})],
  roles:{1:"Jump to the ball on every pass.",2:"Close out under control. On the ball screen, jump to the top side and push him away from it.",3:"Help in the lane when the ball is on the other side.",4:"Low help. Tag the roller when the screen comes.",5:"Call ICE, then drop to the baseline side and stop the drive."},
  notes:"Closeout: sprint two-thirds of the way, then chop your feet, hand high, weight back.\nICE (also called blue): on a side ball screen we keep the ball on the sideline and out of the middle."},
 {id:"pb-zone-23",side:"defense",cat:"Zone",name:"2-3 zone",court:"half",phases:[
   DP([[205,252],[295,252],[125,95],[375,95],[250,85]],[[250,310],[430,210],[70,210],[462,32],[250,192]],"1",{cap:"2-3 zone: X1 and X2 up top, X3 and X4 low on the sides, X5 in the middle. The guards split the ball."}),
   DP([[283,212],[405,205],[175,80],[390,95],[300,75]],[[250,310],[430,210],[70,210],[462,32],[250,192]],"2",{cap:"Ball on the wing: X2 takes it. X1 drops to the high post; the back line shifts toward the ball."}),
   DP([[282,215],[400,160],[240,80],[440,55],[345,78]],[[250,310],[430,210],[70,210],[462,32],[250,192]],"4",{cap:"Ball in the corner: X4 runs out, X5 takes the ball-side block, X2 sinks into the gap, X3 protects the rim."}),
   DP([[283,212],[405,205],[175,80],[390,95],[300,75]],[[250,310],[430,210],[70,210],[462,32],[250,192]],"2",{cap:"Ball back to the wing: X2 steps out again and the back line slides back up."})],
  roles:{1:"Top-left. Split the ball at the top; drop to the high post when the ball goes away.",2:"Top-right. Take the ball on your wing; sink to the gap when it goes to the corner.",3:"Left low. Corner and block on your side; protect the rim from the help side.",4:"Right low. Run out to the corner; back to the block when it leaves.",5:"Middle. Front the post on the ball side; never leave the paint."},
  notes:"Move on the pass, hands up in the passing lanes.\nTalk on every pass: ball, corner, high post. On a shot, find a body and box out."},
 {id:"pb-zone-131",side:"defense",cat:"Zone",name:"1-3-1 zone",court:"half",phases:[
   DP([[250,282],[115,195],[385,195],[250,62],[250,180]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"1",{cap:"1-3-1: X1 on the point, X2 and X3 on the wings, X5 at the high post, X4 on the baseline."}),
   DP([[305,255],[180,140],[408,200],[340,70],[300,165]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball on the wing: X3 takes it. X1 cuts off the pass back to the top, X5 slides over, X4 takes the block."}),
   DP([[395,190],[245,78],[446,64],[432,22],[330,82]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"4",{cap:"Ball in the corner: TRAP. X4 runs the baseline and X3 drops; X5 takes the block, X1 the wing, X2 the rim."}),
   DP([[305,255],[180,140],[408,200],[340,70],[300,165]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball out of the trap to the wing: back to your spots, X3 on the ball."})],
  roles:{1:"Point. Pressure the ball, steer it to a side, then cut off the reversal.",2:"Left wing. Take the ball on your side; sink to the rim when it's away.",3:"Right wing. Take the ball on your side; trap the corner with X4.",4:"Baseline (rover). Cover corner to corner; trap with the wing.",5:"Middle. Own the high post; slide to the ball-side block."},
  notes:"The 1-3-1 takes away the high post and the wings and pushes the ball to the corners, where we trap.\nThe baseline man must be quick: he covers both corners."},
 {id:"pb-zone-32",side:"defense",cat:"Zone",name:"3-2 zone",court:"half",phases:[
   DP([[250,282],[120,210],[380,210],[175,85],[325,85]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"1",{cap:"3-2 zone: X1 at the top, X2 and X3 on the wings, X4 and X5 low."}),
   DP([[300,240],[185,175],[408,202],[225,80],[355,85]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball on the wing: X3 takes it. X1 drops to the elbow, X5 takes the block, X4 slides to the rim, X2 sinks."}),
   DP([[290,195],[225,105],[405,150],[325,72],[440,52]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"4",{cap:"Ball in the corner: X5 runs out, X4 slides to the block, X3 sinks into the gap, X2 protects the rim."}),
   DP([[300,240],[185,175],[408,202],[225,80],[355,85]],[[250,320],[430,210],[70,210],[462,32],[155,80]],"2",{cap:"Ball back to the wing: X3 back out, X5 back to the block."})],
  roles:{1:"Top. Pressure the ball; drop to the high post when it goes to a wing.",2:"Left wing. Take the ball on your side; sink to the lane when it's away.",3:"Right wing. Take the ball on your side; sink to the gap when it goes to the corner.",4:"Left low. Corner and block on your side; slide across to the rim.",5:"Right low. Run out to the corner; back to the block when it leaves."},
  notes:"The 3-2 pressures perimeter shooters. Its weak spots are the short corner and the low post.\nThe low men talk and slide hard."},
 {id:"pb-box-and-one",side:"defense",cat:"Special situations",name:"Box-and-one",court:"half",phases:[
   DP([[405,224],[205,248],[295,248],[188,78],[325,85]],[[250,310],[430,210],[70,210],[462,32],[155,80]],"1",{cap:"Box-and-one: X1 chases their best player (2) and denies him. The other four play a box."}),
   DP([[375,60],[205,248],[295,248],[188,78],[325,85]],[[250,310],[360,25],[70,210],[462,32],[155,80]],"1",{cap:"2 cuts to the baseline. X1 stays attached on his top side; the box stays home."}),
   DP([[70,78],[205,248],[295,248],[188,78],[325,85]],[[250,310],[38,60],[70,210],[462,32],[155,80]],"1",{curve:{1:[220,20]},cap:"2 runs the baseline to the other corner. X1 chases him all the way."}),
   DP([[62,100],[100,200],[250,215],[180,100],[250,80]],[[250,310],[38,60],[70,210],[462,32],[155,80]],"3",{cap:"Ball to the left wing: the box slides like a zone. X1 stays attached to 2, denying."})],
  roles:{1:"Chaser. Face-guard their star everywhere; deny every catch.",2:"Top-left of the box. Take the ball on your side.",3:"Top-right of the box. Take the ball on your side; drop to the high post.",4:"Bottom-left. Block and corner on your side.",5:"Bottom-right. Block and corner on your side; slide to the rim."},
  notes:"Use it when one player is beating us. The chaser never helps; the box helps him.\nMake them beat us with their other four."},
 {id:"pb-press-221",side:"defense",cat:"Press",name:"2-2-1 press",court:"full",phases:[

  admRestore(d){if(!isAdmin())return;const a=admEff(audById(d.id)||{});if(!a.id)return;const rs=canRestore(a);const lab=esc(admLabel(a));

        const checks=ds.flatMap(d=>{const g=gOf(d);const sum=gs[d].reduce((a,l)=>a+l.pts,0);const out=[];if(sum!==+g.us)out.push(`${nice(d)}: player points add to ${sum}, but the final was ${N(g.us)}.`);
          gs[d].filter(l=>l.fgm>l.fga||l.tpm>l.tpa||l.ftm>l.fta||l.tpm>l.fgm||l.pts!==2*(l.fgm-l.tpm)+3*l.tpm+l.ftm).forEach(l=>{const p=P(l.id);out.push(`${nice(d)}: #${esc(p.no)} ${esc(pName(p))}'s shooting numbers don't add up to his points.`)});return out});
        const issues=[...errs.map(esc),...checks,...warns.map(esc)];
        if(issues.length&&!forceImport){forceImport=true;$("#csvmsg").innerHTML=`<span style="color:var(--warn)">${issues.join("<br>")}</span><br>${plural(ds.length,"game")} can be imported${errs.length?`; ${plural(errs.length,"problem row")} would be skipped`:""}. Fix the file, or tap <b>Import</b> again to import anyway.`;return}
        forceImport=false;
        for(const d of ds){const g=gOf(d);await saveDoc("statgames",boxKey(g),{lines:gs[d],ts:Date.now()})}
        importMsg=`<span style="color:var(--good)">Imported ${plural(ds.length,"game")}.</span>${issues.length?` <span class="muted">Imported with the problems listed before.</span>`:""}`;render();toast("Stats imported")}catch(e){forceImport=false;$("#csvmsg").innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`}};
    }
  }
  if(r==="playbook")bindPlaybook();
  if(r==="admin")bindAdmin();
  if(r==="calendar"){const mm=$("#mm");if(mm){let x0=null,y0=0;mm.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});
    mm.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)ACT.calNav({dir:dx<0?"1":"-1"})},{passive:true})}}
  if(r==="glossary"){$$("[data-gtab]").forEach(b=>b.onclick=()=>{glossTab=b.dataset.gtab;render()});
    $$("[data-ggrp]").forEach(b=>b.onclick=()=>{glossGrp=glossGrp===b.dataset.ggrp?"":b.dataset.ggrp;render();const n=$(`[data-ggrp="${CSS.escape(glossGrp)}"]`);if(n){n.focus({preventScroll:true});n.scrollIntoView({block:"nearest",inline:"center"})}});
    $$("[data-gall]").forEach(b=>b.onclick=()=>{const open=b.dataset.gall==="open";$$("details.ggroup").forEach(d=>{open?glossOpen.add(d.dataset.grp):glossOpen.delete(d.dataset.grp)});render()});
    $$("details.ggroup").forEach(d=>d.addEventListener("toggle",()=>{if(glossQ.trim()||glossGrp)return;d.open?glossOpen.add(d.dataset.grp):glossOpen.delete(d.dataset.grp);const b=$("[data-gall]");if(b){const all=$$("details.ggroup").every(x=>x.open);b.dataset.gall=all?"close":"open";b.textContent=all?"Collapse all":"Expand all"}}));
    const q=$("#gq");if(q)q.oninput=()=>{glossQ=q.value;const pos=q.selectionStart;render();const n=$("#gq");n.focus();n.setSelectionRange(pos,pos)}}

/* Helper for Claude to add plays for the coaches (signed in as Coach):
   CPC.addPlay({name,side:"offense"|"defense",cat,court,roles,notes,phases,hidden?}); defense phases may carry opp:{1:[x,y],..} and ballAt:"1".."5" */
window.CPC={async addPlay(o){if(!user||!isCoach())throw new Error("Sign in as a coach first");if(!o||!String(o.name||"").trim()||!o.cat||!Array.isArray(o.phases)||o.phases.length<2)throw new Error("A play needs a name, a category and at least 2 steps");
  const dup=plays().find(p=>p.name.trim().toLowerCase()===String(o.name).trim().toLowerCase());if(dup)throw new Error("A play named "+dup.name+" already exists");
  if(o.side!=null&&!SIDE_L[o.side])throw new Error('side must be "offense" or "defense"');
  const id=uid("pl");await saveDoc("plays",id,{name:String(o.name).trim().slice(0,80),side:o.side||(o.cat==="Defense"?"defense":"offense"),cat:o.cat,court:o.court==="full"?"full":"half",roles:o.roles||{},notes:String(o.notes||"").slice(0,3000),phases:cleanPhases(o.phases),author:user.cid,ts:Date.now(),...(o.hidden||o.draft?{draft:true}:{})});render();return id},
  /* CPC.addGames([{date:"YYYY-MM-DD",time:"19:00"|"7:00 PM"|"TBA",opp:"Opponent name",site?:"home"|"away"|"neutral",home?:bool,lg?:bool,
       type?:"exh",event?:"Jamboree",venue?:"Name (neutral site only)",city?}]) creates missing opponents; skips a game when we already play that opponent on that date (a date can hold several games) */
  async addGames(list){needCoach();if(!Array.isArray(list))throw new Error("addGames needs an array of games");const out={added:[],skipped:[]};
    for(const g of list){if(!g||!realDate(g.date)||!String(g.opp||"").trim()||parseTime(g.time)===null)throw new Error("Bad game: "+JSON.stringify(g));
      {const ex=cpcFindOpp(String(g.opp).replace(/\s+/g," ").trim());if(ex&&games().some(x=>x.date===g.date&&x.opp===ex.id)){out.skipped.push(g.date);continue}}
      const exh=g.type==="exh";const oid=await cpcOpp(g.opp,{city:g.city,league:!exh&&!!g.lg});
      const site=["home","away","neutral"].includes(g.site)?g.site:(g.home?"home":"away");
      const obj=cpcGameExtras({date:g.date,time:parseTime(g.time),opp:oid,site,home:site==="home",lg:!exh&&!!g.lg},g);
      await saveDoc("games",uid("g"),obj);out.added.push(g.date)}
    render();return out},
  /* CPC.updateGame("YYYY-MM-DD",{time?,site?,lg?,type?:"exh"|"reg",event?,venue?,opp?:"Opponent name"},which?) -> true | false (no game that day).
       which = {opp?:"Name",time?:"5:20 PM"} picks one game when the date has several (required then). */
  async updateGame(date,patch,which){needCoach();const g=cpcPickGame(date,which);if(!g)return false;patch=patch||{};
    const allowed=["time","site","lg","type","event","venue","opp"];const extra=Object.keys(patch).filter(k=>!allowed.includes(k));if(extra.length)throw new Error("updateGame can't change: "+extra.join(", "));
    const {d:_d,played:_p,res:_r,id:_i,...base}=g;const obj={...base};
    if("time" in patch){const t=parseTime(patch.time);if(t===null)throw new Error("Can't read the time “"+patch.time+"”. Use 19:00, 7:00 PM or TBA");obj.time=t}
    if("site" in patch){if(!["home","away","neutral"].includes(patch.site))throw new Error("site must be home, away or neutral");obj.site=patch.site}
    obj.site=siteOf(obj);obj.home=obj.site==="home";
    if("type" in patch){if(patch.type==="exh")obj.type="exh";else if(patch.type==null||patch.type==="reg"||patch.type==="")delete obj.type;else throw new Error('type must be "exh" or "reg"')}
    if("lg" in patch)obj.lg=!!patch.lg;
    if("opp" in patch){if(!String(patch.opp||"").trim())throw new Error("Opponent is required");obj.opp=await cpcOpp(patch.opp,{league:obj.type!=="exh"&&!!obj.lg})}
    const ext={event:"event" in patch?patch.event:obj.event,venue:"venue" in patch?patch.venue:obj.venue,type:obj.type};
    await saveDoc("games",g.id,cpcGameExtras(obj,ext));render();return true},
  /* CPC.removeGame("YYYY-MM-DD",which?) -> true | false. Also removes that game's imported box score. which as in updateGame. */
  /* CPC.addEvents([{date:"YYYY-MM-DD",start:"HH:MM"|"",end:"HH:MM"|"",title,kind,who:"all"|"coaches",note?}]) checks every event first,

  async addEvents(list){needCoach();if(!Array.isArray(list))throw new Error("addEvents needs an array of events");
    const clean=list.map(cleanEvent);const keys=new Set(items("events").map(evDupKey));let added=0,skipped=0;const ts=Date.now();
    for(const e of clean){const k=evDupKey(e);if(keys.has(k)){skipped++;continue}keys.add(k);await saveDoc("events",uid("ev"),{...e,author:user.cid||"coach",ts});added++}
    render();return{added,skipped}},
  /* CPC.clearEvents("YYYY-MM-DD","YYYY-MM-DD") removes every calendar event in that range (both ends included). Returns how many. */
  async clearEvents(fromDate,toDate){needCoach();if(!realDate(fromDate)||!realDate(toDate))throw new Error("clearEvents needs two dates as YYYY-MM-DD");if(toDate<fromDate)throw new Error("toDate must be on or after fromDate");
    const gone=items("events").filter(e=>e.date>=fromDate&&e.date<=toDate);for(const e of gone)await removeDoc("events",e.id);render();return gone.length},
  async removeGame(date,which){needCoach();const g=cpcPickGame(date,which);if(!g)return false;const k=boxKey(g);if(store.statgames[k])await removeDoc("statgames",k);await removeDoc("games",g.id);render();return true},
  /* CPC.splitGame("YYYY-MM-DD","Old opponent",[{opp,time,site?,type?,event?,venue?,lg?}]) replaces one game with several on the same date.

  async splitGame(date,fromOpp,list){needCoach();if(!realDate(date))throw new Error("splitGame needs a date as YYYY-MM-DD");if(!Array.isArray(list)||!list.length)throw new Error("splitGame needs a list of new games");

      for(const g of old){await removeDoc("games",g.id);removed++}}
    const r=await CPC.addGames(list.map(x=>({...x,date})));
    let oppRemoved=false;if(from&&get("opps",from.id)&&!games().some(g=>g.opp===from.id)&&!hasScout(from)&&!get("stand",from.id)&&!items("lres").some(x=>x.a===from.id||x.b===from.id)){await removeDoc("opps",from.id);oppRemoved=true}
    render();return{removed,added:r.added.length,skipped:r.skipped.length,oppRemoved}},
  /* One-time fix: label the JV games on Nov 25, 2026 as Jamboree games (adds "Jamboree" to the note). Safe to run twice. Returns how many changed. */
  async tagJVJamboree(){needCoach();let n=0;for(const e of items("events").filter(x=>x.date==="2026-11-25"&&x.kind==="game"&&evTeams(x).includes("JV"))){const note=String(e.note||"").trim();if(/jamboree/i.test(note))continue;
      const {id,...rest}=e;await saveDoc("events",id,{...rest,note:note?(note+" · Jamboree").slice(0,300):"Jamboree"});n++}render();return n},
  /* One-time fix: the Nov 25 Jamboree is two exhibitions (Issaquah 5:00 PM, Cascade 5:20 PM), not one "Issaquah & Cascade" game. */
  migrateJamboree(){return CPC.splitGame("2026-11-25","Issaquah & Cascade",[{opp:"Issaquah",time:"17:00",site:"neutral",type:"exh",event:"Jamboree",venue:"TBD"},{opp:"Cascade",time:"17:20",site:"neutral",type:"exh",event:"Jamboree",venue:"TBD"}])},
  /* CPC.updateOpp("Opponent name",{name?,city?,league?}) -> opponent id */
  async updateOpp(name,patch){needCoach();const o=cpcFindOpp(name);if(!o)throw new Error("No opponent named "+name);patch=patch||{};
    const extra=Object.keys(patch).filter(k=>!["name","city","league"].includes(k));if(extra.length)throw new Error("updateOpp can't change: "+extra.join(", "));
    const obj={...o};if("name" in patch){const nm=String(patch.name||"").replace(/\s+/g," ").trim();if(!nm||!/[a-z]/i.test(nm)||nm.length>60)throw new Error("Opponent name needs 1 to 60 characters with a letter");const dp=oppDup(nm,o.id);if(dp)throw new Error("There's already an opponent named "+dp.name);obj.name=nm}

  /* CPC.removeOpp("Opponent name") -> true | false (not found). Refuses while any game points to it; removes its notes, clips, standings row and league results. */
  async removeOpp(name){needCoach();const o=cpcFindOpp(name);if(!o)return false;const gs=games().filter(g=>g.opp===o.id);

  /* CPC.setOppHistory("Opponent name",[{date:"YYYY-MM-DD",site:"home"|"away"|"neutral",us,them,note?,src?,res?}]) replaces opps.last

  async setOppHistory(name,meetings){needCoach();if(!Array.isArray(meetings))throw new Error("meetings must be an array");const PS=pastSeasons();
    const clean=meetings.map((m,k)=>{const at=`Meeting ${k+1}`;if(!m||typeof m!=="object")throw new Error(at+" is not an object");
      if(!inPast2(m.date))throw new Error(`${at}: date must be YYYY-MM-DD in ${PS[1].label} or ${PS[0].label}`);
      if(!["home","away","neutral"].includes(m.site))throw new Error(`${at}: site must be home, away or neutral`);
      const us=Number(m.us),them=Number(m.them);if(![us,them].every(x=>Number.isInteger(x)&&x>=0&&x<=200))throw new Error(`${at}: scores must be whole numbers from 0 to 200`);

  /* CPC.setTeamHistory([{season:"2025-26",w,l,lw,ll,finish?,coach?,notes?}]) -> number of seasons stored (whole numbers 0-40) */
  async setTeamHistory(seasons){needCoach();if(!Array.isArray(seasons))throw new Error("seasons must be an array");const out=[];for(const x of seasons)out.push(cleanSeasonRow(x,out));

      if(x.yr&&!YRS.includes(x.yr))throw new Error("Year must be Fr, So, Jr or Sr: "+first+" "+last);const no=x.no==null?"":String(x.no).trim();if(no&&!/^\d{1,2}$/.test(no))throw new Error("Bad jersey for "+first+" "+last);

  /* CPC.setOppScout("Opponent name",{coach?:{name,tenure,record,offense,defense,press,sets},players?:[{name,no,pos,yr,ht,info}],replacePlayers?:bool,source?:"text" (accepted, not stored)})
