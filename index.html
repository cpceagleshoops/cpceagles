<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPC Eagles Basketball Hub</title>
<meta name="description" content="Cedar Park Christian varsity basketball: schedule, scouting, playbook and stats.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1624">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
/* One committed dark world: deep school navy surfaces, gold accents. Desktop: left rail. Phone: top bar + bottom tab bar, sheets slide up. */
:root{
  --navy:#1c3045; --gold:#ab8c59; --gold-2:#c2b08a; --gold-ink:#d6c299; --slate:#3b596b;
  --bg:#0b1522; --surface:#122033; --surface-2:#182a41; --surface-3:#203653; --line:#22385a;
  --ink:#eef2f7; --muted:#9aacc1; --accent-text:#d6c299;
  --good:#4cc08b; --bad:#e8836b; --warn:#e5b45a;
  --good-bg:rgba(76,192,139,.14); --bad-bg:rgba(232,131,107,.14); --warn-bg:rgba(229,180,90,.14); --gold-bg:rgba(171,140,89,.16);
  --court:#0a1420; --court-line:rgba(194,176,138,.55); --court-paint:rgba(171,140,89,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 420px at 85% -120px,rgba(171,140,89,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.025em;font-weight:700}
h2{font-size:20px} h3{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-text)}


.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100% - 26px)}
.rail{background:linear-gradient(180deg,#0f1c2e,#0b1624);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 6px;text-decoration:none}
.brand .t1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;color:#fff;line-height:1}
.brand .t2{font-size:11px;color:var(--muted);letter-spacing:.03em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:#cfd8e3;font-weight:500;font-size:14px;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:var(--gold-bg);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
.nav a.on .ic{color:var(--gold-2)}
.ic{width:18px;height:18px;flex:none;color:var(--muted)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;flex-direction:column;gap:8px}
.me .who{font-weight:600;color:#fff;font-size:13.5px}
.me .role{font-size:11.5px;color:var(--gold-2)}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--good)}
.topbar,.tabbar{display:none}

main{padding:22px clamp(16px,2.6vw,34px) 60px;max-width:1180px;width:100%;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section{margin-top:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel+.panel{margin-top:10px}
.panel>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary h2{font-size:19px}
.panel>summary .sum{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.chev{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .2s}
.panel[open]>summary .chev{transform:rotate(90deg)}
.panel[open]>summary{border-bottom:1px solid var(--line)}
.pbody{padding:14px 16px 16px}
.ptools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel.keys{border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(171,140,89,.16),rgba(171,140,89,.05))}
.keys ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:600}

.hero{background:linear-gradient(135deg,#16283f 0%,#1c3045 50%,#2a4762 100%);color:#fff;border:1px solid rgba(194,176,138,.22);position:relative;overflow:hidden;padding:20px}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(194,176,138,.10)}
.hero .eyebrow{color:var(--gold-2)}
.hero h2{font-size:32px;margin:4px 0 2px;text-transform:uppercase;font-weight:700}
.hero .meta{color:#c9d4df;font-size:13.5px}
.hero .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;align-items:center}
.pill{display:inline-flex;gap:6px;align-items:baseline;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:12px;color:#c9d4df;margin-top:10px;margin-right:6px;position:relative;z-index:1}
.pill b{font-family:var(--display);font-size:17px;color:#fff}

.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 10px}
.kv .k,.tile .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kv .v{font-family:var(--display);font-size:25px;font-weight:600;line-height:1.1}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s;min-height:36px}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#101a27}
.btn.gold:hover{background:var(--gold-2)}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn.danger{color:var(--bad);border-color:rgba(232,131,107,.4);background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;min-height:30px}
.btn.icon{padding:0;width:36px;height:36px}
.btn.edit{background:transparent;border-color:rgba(194,176,138,.35);color:var(--gold-ink)}
.btn.edit svg{width:13px;height:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.gold{background:var(--gold-bg);color:var(--accent-text)}
.chip.verified::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.res{font-family:var(--display);font-weight:700;font-size:16px;width:22px;display:inline-block}
.res.W{color:var(--good)} .res.L{color:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .date{font-family:var(--display);font-size:13px;line-height:1.05;color:var(--muted);text-transform:uppercase}
.li .date b{display:block;font-size:22px;color:var(--ink);font-weight:600}
.li .opp{font-weight:600;text-decoration:none}
.li a.opp:hover{color:var(--accent-text)}
.li .right{display:flex;align-items:center;gap:8px}
.upnext{background:var(--gold-bg);border-radius:10px;border-top-color:transparent!important;padding-left:8px;padding-right:8px}
.upnext+.li{border-top-color:transparent}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2);cursor:pointer;user-select:none}
th.nosort{cursor:default} th.sorted{color:var(--accent-text)}
td:first-child,th:first-child,td.l,th.l{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
tr.me-row{background:var(--gold-bg)!important}
td.us{font-weight:700}

.pcard{display:flex;gap:12px;align-items:center;text-decoration:none;padding:12px 14px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
a.pcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.pcard::after{content:attr(data-no);position:absolute;right:-4px;bottom:-26px;font-family:var(--display);font-size:92px;font-weight:700;color:var(--gold-2);opacity:.08;pointer-events:none}
.jersey{font-family:var(--display);font-size:32px;font-weight:700;color:var(--accent-text);width:46px;text-align:center;line-height:1;flex:none}
.pname{font-weight:700;font-size:14.5px}
.pline{font-size:12.5px;color:var(--muted)}
.phero{background:linear-gradient(135deg,#132338 0%,#1c3045 45%,#2c4a66 100%);border:1px solid rgba(194,176,138,.22);color:#fff;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.phero .pnum{position:absolute;right:18px;top:-38px;font-family:var(--display);font-size:230px;font-weight:700;color:rgba(194,176,138,.13);line-height:1;pointer-events:none}
.phero .eyebrow{color:var(--gold-2)}
.phero h1{color:#fff;font-size:42px;margin:4px 0 12px;position:relative}
.phero .tools{position:absolute;right:16px;top:16px;z-index:2;gap:6px}
@media (max-width:820px){.phero .tools{position:relative;right:auto;top:auto;margin-bottom:12px}}
.bigstats{display:flex;gap:26px;flex-wrap:wrap;position:relative}
.bigstats b{display:block;font-family:var(--display);font-size:38px;font-weight:600;line-height:1}
.bigstats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#b9c6d3}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative}
.bdg{display:inline-flex;align-items:center;gap:6px;background:rgba(194,176,138,.14);border:1px solid rgba(194,176,138,.35);color:#f2e6cf;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.bdg svg{color:var(--gold-2)}

.scheme{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:14px;margin:0}
.scheme dt{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.scheme dd{margin:0}
.oplayer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.oplayer .top{display:flex;gap:10px;align-items:baseline}
.oplayer .jersey{font-size:26px;width:auto}
.statline{display:flex;gap:14px;margin:6px 0;font-size:12px;color:var(--muted)}
.statline b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);font-weight:600;line-height:1}
.tend{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.note{border-top:1px solid var(--line);padding:10px 2px;display:flex;flex-direction:column;gap:3px}
.note:first-child{border-top:none;padding-top:0}
.note .by{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note .by b{color:var(--ink)}
.note .by .btn{margin-left:auto}
.note p{margin:0;white-space:pre-wrap}
.clip{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.clip:first-child{border-top:none;padding-top:0}
.playic{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;flex:none;border:1px solid rgba(194,176,138,.3)}
.ts{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent-text)}
.oppcard{text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.oppcard:hover{transform:translateY(-2px);border-color:var(--gold)}
.oppcard h3{font-size:22px;text-transform:uppercase}
.post{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:none;padding-top:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;border:1px solid rgba(194,176,138,.3)}
.post p{margin:2px 0 0;white-space:pre-wrap}

.form{display:flex;flex-direction:column;gap:11px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
label.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
label.check input{width:20px;height:20px;accent-color:var(--gold)}
input[type=text],input[type=search],input[type=url],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;width:100%;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(171,140,89,.2)}
.hint{font-size:11.5px;color:var(--muted);font-weight:500}
div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.sheet .seg{display:flex}.sheet .seg button{flex:1;font-size:13.5px;min-height:38px}
.tba{margin-top:4px;font-size:13px}
input:disabled{opacity:.45}
.check.off{opacity:.55}
.totrow td{font-weight:700;border-top:2px solid var(--line)}
.meet{padding:8px 0;border-top:1px solid var(--line)}.meet:first-child{border-top:none;padding-top:0}
.meet .row{gap:8px}.ts-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.morep{margin-top:10px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:30px}
.seg button.on{background:var(--surface-3);color:#fff}

/* Sheet (edit dialogs) */
.sheet-back{position:fixed;inset:0;background:rgba(4,9,16,.6);backdrop-filter:blur(2px);z-index:60;animation:fadein .15s ease}
.sheet{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px;text-transform:uppercase}
.sheet-body{padding:16px 18px;overflow:auto}
.sheet-foot{display:flex;gap:8px;padding:12px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);align-items:center}
.sheet-foot .grow{flex:1}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%) translateY(-20px);background:#0f2a1f;border:1px solid rgba(76,192,139,.5);color:#d8f5e7;padding:10px 16px 10px 12px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#3a1d17;border-color:rgba(232,131,107,.5);color:#ffe2da}
.toast .tick{width:22px;height:22px;border-radius:50%;background:var(--good);color:#0b1522;display:grid;place-items:center;flex:none}
.toast.err .tick{background:var(--bad)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:calc(32px + var(--safe-t)) 18px calc(32px + var(--safe-b));background:radial-gradient(900px 520px at 85% -10%,rgba(171,140,89,.22),transparent 60%),linear-gradient(160deg,#0d1a2c,#1c3045 55%,#22405c)}
.loginbox{width:min(400px,100%);color:#fff}
.loginbox h1{font-size:42px;margin:16px 0 4px;color:#fff}
.loginbox p.lead{color:#c3cfdb;margin:0 0 22px}
.loginform{background:rgba(10,20,32,.45);border:1px solid rgba(194,176,138,.25);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.loginform label.f{color:#c3cfdb}
.loginerr{color:#f2b7a8;font-size:13px;min-height:1em}
.fine{margin-top:16px;font-size:12px;color:#9fb0c2}

/* Playbook */
.pbwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.plist{padding:10px}
.plist .cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.plist button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;gap:8px}
.plist button:hover{background:var(--surface-2)}
.plist button.on{background:var(--gold-bg);color:var(--accent-text)}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.stage.wide{grid-template-columns:1fr}
.courtbox{background:var(--court);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.court{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.court .pl{cursor:pointer}
.court.mode-move .pl{cursor:grab}
.controls{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.controls input[type=range]{flex:1;min-width:120px;accent-color:var(--gold)}
.stepl{font-family:var(--display);font-size:16px;font-weight:600;min-width:84px}
.legend{display:flex;flex-direction:column;gap:6px}

function toastUndo(msg,snaps){toast(msg);if(!snaps||!snaps.length)return;const t=$("#toast");const b=document.createElement("button");b.className="undo";b.textContent="Undo";
  b.onclick=async()=>{t.classList.remove("show");t.style.pointerEvents="none";await restoreAll(snaps);render();toast("Restored")};t.appendChild(b);t.style.pointerEvents="auto";clearTimeout(toast._t);toast._t=setTimeout(()=>{t.classList.remove("show");t.style.pointerEvents="none"},CONFIG.undoSeconds*1000)}

/* ================= Shell ================= */
function whoLabel(){return isCoach()?["Coach","Signed in with the coach login"]:["Eagles player","Signed in with the player login"]}
function render(){
  pendingRender=false;const app=$("#app");
  const msgScreen=(msg,btns)=>`<div class="login"><div class="loginbox" style="text-align:center">${MARK(84)}<p class="lead" style="margin-top:16px" role="status">${msg}</p>${btns?`<div class="row" style="justify-content:center;gap:10px;margin-top:16px">${btns}</div>`:""}</div></div>`;
  if(SB_FATAL){app.innerHTML=msgScreen("Couldn't load the team site. Check your connection and refresh.",`<button class="btn gold" data-act="sbReload">Refresh</button>`);return}
  if(SB&&sbBooting){app.innerHTML=msgScreen("Loading the team hub…");return}
  if(!user||!["coach","player"].includes(user.role)){user=null;app.innerHTML=loginView();bindLogin();return}
  if(SB&&sbFailed){app.innerHTML=msgScreen("Couldn't load the team data. Check your connection and try again.",`<button class="btn gold" data-act="sbRetry">Retry</button><button class="btn" data-act="signout">Sign out</button>`);return}
  if(SB&&!sbLoaded){app.innerHTML=msgScreen("Loading the team hub…");return}
  let r=route();if(!allowed(r)){r="home";if(location.hash&&location.hash!=="#home")history.replaceState(null,"","#home")}
  const [nm,rl]=whoLabel();
  const on=k=>r===k||(k==="scouting"&&r.startsWith("opp-"))||(k==="roster"&&r.startsWith("player-"))||(k==="schedule"&&r.startsWith("game-"));
  const moreOn=!TABS.some(on);
  app.innerHTML=`  <header class="topbar">${MARK(26)}<span class="t1">CPC EAGLES</span><span class="sp"></span><span class="sync small"></span></header>
  <div class="shell"><aside class="rail"><a class="brand" href="#home">${MARK()}<div><div class="t1">CPC EAGLES</div><div class="t2">${esc(CONFIG.level)} · ${esc(CONFIG.season)}</div></div></a>
  <nav class="nav" aria-label="Main">${ROUTES[user.role].map(k=>`<a href="#${k}" class="${on(k)?"on":""}">${ico(k)}${LABEL[k]}</a>`).join("")}</nav>
  <div class="me"><div><div class="who">${esc(nm)}</div><div class="role">${esc(rl)}</div></div><div class="sync"></div><div class="row">${isCoach()?`<button class="btn sm" data-act="logins">Passwords</button>`:""}<button class="btn sm" data-act="signout">Sign out</button></div></div></aside>
  <main id="main" class="fade">${tipFor(r)}${view(r)}</main></div>
  <nav class="tabbar" aria-label="Main">${TABS.map(k=>`<a href="#${k}" class="${on(k)?"on":""}">${ico(k)}${LABEL[k]}</a>`).join("")}<button class="${moreOn?"on":""}" data-act="more">${ico("more")}More</button></nav>`;
  paintSync();
  $$("details.panel").forEach(d=>d.addEventListener("toggle",()=>{d.open?openSet.add(d.dataset.panel):openSet.delete(d.dataset.panel)}));
  bindView(r);
}
function view(r){
  if(r==="home")return homeView();if(r==="schedule")return scheduleView();if(r==="roster")return rosterView();if(r==="stats")return statsView();
  if(r==="scouting")return scoutingView();if(r.startsWith("opp-"))return oppView(r.slice(4));if(r==="league")return leagueView();
  if(r==="playbook")return playbookView();if(r==="glossary")return glossaryView();if(r.startsWith("player-"))return playerView(r.slice(7));
if(r.startsWith("game-"))return gameView(r.slice(5));if(r==="badges")return badgesView();return homeView();
}

/* ================= Login (per-user passwords, stored only as salted hashes) ================= */
const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const pwField=(id,label,ac)=>`<label class="f pw" for="${id}">${label}<input type="password" id="${id}" autocomplete="${ac}" required><button type="button" class="eye" data-eye="${id}" aria-label="Show password" aria-pressed="false">${EYE}</button></label>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-eye]");if(!b)return;e.preventDefault();const i=document.getElementById(b.dataset.eye);if(!i)return;const show=i.type==="password";i.type=show?"text":"password";b.setAttribute("aria-pressed",show);b.setAttribute("aria-label",show?"Hide password":"Show password");i.focus()});
async function hashPw(pw,salt){const data=new TextEncoder().encode(salt+":"+pw);const buf=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function setPassword(username,pw){const salt=newSalt();await saveDoc("accounts",username,{salt,hash:await hashPw(pw,salt),setAt:Date.now()})}
const findAccount=u=>u==="coach"?{kind:"coach"}:u==="player"?{kind:"player"}:null;
const liveAcct=u=>store.accounts[u]&&!store.accounts[u].deleted?store.accounts[u]:null;
let loginStage={step:"signin"},fails=0,lockUntil=0;
function loginView(){
  const st=loginStage;
  const body=st.step==="create"?`<p class="small" style="margin:0;color:#c3cfdb"><b style="color:#fff">First-time setup.</b> Create the two team passwords. Coaches use the coach password; every player uses the player password.</p>${pwField("lg-new","Coach password (at least "+CONFIG.minPassword.coach+" characters)","new-password")}${pwField("lg-new2","Coach password again","new-password")}${pwField("lg-pl","Player password (at least "+CONFIG.minPassword.player+" characters)","new-password")}<div class="loginerr" id="lg-err" aria-live="polite"></div><button class="btn gold" type="submit">Save passwords and sign in</button><button class="btn" type="button" id="lg-back">Back</button>`
   :`<label class="f" for="lg-user">Login<select id="lg-user" autocomplete="username"><option value="player" ${st.u==="coach"?"":"selected"}>Player</option><option value="coach" ${st.u==="coach"?"selected":""}>Coach</option></select></label>${pwField("lg-pass","Password","current-password")}<div class="loginerr" id="lg-err" aria-live="polite"></div><button class="btn gold" type="submit">Sign in</button>`;
  return `<div class="login"><div class="loginbox">${MARK(84)}<h1>Eagles Basketball Hub</h1><p class="lead">${esc(CONFIG.school)} · ${esc(CONFIG.campus)} · ${esc(CONFIG.level)}</p>
  <form class="loginform" id="loginform" autocomplete="on" novalidate>${body}</form>
  <p class="fine">Players: get the team password from your coach.${SB?"":" Coaches can change both passwords anytime."}</p></div></div>`;
}
function bindLogin(){
  const err=m=>{const e=$("#lg-err");if(e)e.textContent=m};
  const finish=a=>{fails=0;user=a.kind==="coach"?{role:"coach",cid:"coach"}:{role:"player"};LS.set(CONFIG.sessionKey,user);loginStage={step:"signin"};location.hash="home";render();toast(a.kind==="coach"?"Signed in as a coach":"Signed in. Go Eagles!")};
  const back=$("#lg-back");if(back)back.onclick=()=>{loginStage={step:"signin",u:loginStage.u};render()};
  $("#loginform").onsubmit=async e=>{e.preventDefault();
    if(SB){if(Date.now()<lockUntil)return err(`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`);
      const u=$("#lg-user").value,pw=$("#lg-pass").value;if(!pw)return err("Enter your password.");
      const btn=$("#loginform button[type=submit]");btn.disabled=true;err("");
      let res;try{res=await SB.auth.signInWithPassword({email:u==="coach"?CONFIG.supabase.coachEmail:CONFIG.supabase.playerEmail,password:pw})}catch(x){res={error:x}}
      btn.disabled=false;
      if(res.error){const bad=res.error.status===400;if(bad){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}}err(bad?"That password isn't right.":"Couldn't sign in right now. Try again in a minute.");$("#lg-pass").value="";$("#lg-pass").focus();return}
      fails=0;user=sbUserFromSession(res.data.session)||(u==="coach"?{role:"coach",cid:"coach"}:{role:"player"});loginStage={step:"signin"};location.hash="home";render();toast(user.role==="coach"?"Signed in as a coach":"Signed in. Go Eagles!");sbLoad();return}
    if(loginStage.step==="create"){const p1=$("#lg-new").value,p2=$("#lg-new2").value,pl=$("#lg-pl").value;
      if(p1.length<CONFIG.minPassword.coach)return err(`The coach password needs at least ${CONFIG.minPassword.coach} characters.`);if(p1!==p2)return err("The two coach passwords don't match.");
      if(pl.length<CONFIG.minPassword.player)return err(`The player password needs at least ${CONFIG.minPassword.player} characters.`);if(pl===p1)return err("Use a different password for players.");
      if(liveAcct("coach"))return err("Passwords were already set up. Go back and sign in.");
      await setPassword("coach",p1);await setPassword("player",pl);return finish({kind:"coach"})}
    if(Date.now()<lockUntil)return err(`Too many tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`);
    const u=$("#lg-user").value,pw=$("#lg-pass").value;
    const a=findAccount(u);const acct=liveAcct(u);
    if(!liveAcct("coach")){if(u==="coach"){loginStage={step:"create",u};render();setTimeout(()=>$("#lg-new")&&$("#lg-new").focus(),30);return}return err("The site isn't set up yet. Ask your coach for the team password.")}
    if(a&&!acct)return err("The player password hasn't been set yet. Ask your coach.");
    if(!pw)return err("Enter your password.");
    if(a&&acct&&await hashPw(pw,acct.salt)===acct.hash)return finish(a);
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}
    err("That password isn't right.");$("#lg-pass").value="";$("#lg-pass").focus()};
}

/* ================= Edit sheet (Edit → Save, with toast) ================= */
let sheetCfg=null,sheetInit="",lastFocus=null,suppressPop=0;
const formState=()=>JSON.stringify($$("#sheetform input,#sheetform select,#sheetform textarea").map(e=>e.type==="checkbox"?e.checked:e.value));
function openSheet(cfg){
  sheetCfg=cfg;const v=cfg.value||{};if(!$("#sheetroot").firstChild){lastFocus=document.activeElement;history.pushState({sheet:1},"",location.href)}
  const field0=f=>{const id="sf-"+f.key;const val=v[f.key];const req=f.req?"required":"";const hint=f.hint?`<span class="hint">${esc(f.hint)}</span>`:"";
    if(f.type==="password")return `<label class="f pw" for="${id}">${esc(f.label)}${hint}<input type="password" id="${id}" ${req} autocomplete="new-password"><button type="button" class="eye" data-eye="${id}" aria-label="Show password" aria-pressed="false">${EYE}</button></label>`;
    if(f.type==="check")return `<label class="check" for="${id}"><input type="checkbox" id="${id}" ${val?"checked":""}>${esc(f.label)}</label>`;
    if(f.type==="height"){const ph=parseHt(val);const opt=(n,u,sel)=>`<option value="${n}" ${sel?"selected":""}>${n} ${u}</option>`;
      return `<div class="grid g2" style="gap:10px"><label class="f" for="${id}">${esc(f.label)} (feet)${val&&!ph?`<span class="hint">Now “${esc(val)}”. Pick feet and inches to replace it.</span>`:""}<select id="${id}"><option value="">—</option>${[4,5,6,7].map(n=>opt(n,"ft",ph&&ph[0]===n)).join("")}</select></label><label class="f" for="${id}-in">${esc(f.label)} (inches)<select id="${id}-in"><option value="">—</option>${[...Array(12).keys()].map(n=>opt(n,"in",ph&&ph[1]===n)).join("")}</select></label></div>`}
    if(f.type==="seg")return `<div class="f" role="group" aria-labelledby="${id}-l"><span id="${id}-l">${esc(f.label)}</span>${hint}<div class="seg">${f.options.map(([ov,ol])=>`<button type="button" data-seg="${id}" data-v="${esc(ov)}" class="${String(val)===String(ov)?"on":""}" aria-pressed="${String(val)===String(ov)}">${esc(ol)}</button>`).join("")}</div><input type="hidden" id="${id}" value="${esc(val??"")}"></div>`;
    if(f.type==="time"){const tba=val==="TBA";return `<div style="display:flex;flex-direction:column;gap:6px"><label class="f" for="${id}">${esc(f.label)}${hint}<input type="time" id="${id}" ${req} value="${tba?"":esc(val??"")}" ${tba?"disabled":""}></label>${f.tba?`<label class="check tba" for="${id}-tba"><input type="checkbox" id="${id}-tba" ${tba?"checked":""}>${esc(f.tba)}</label>`:""}</div>`}
    if(f.type==="textarea"||f.type==="list")return `<label class="f" for="${id}">${esc(f.label)}${hint}<textarea id="${id}" ${req} ${f.max?`maxlength="${f.max}"`:""} placeholder="${esc(f.ph||"")}">${esc(f.type==="list"?(val||[]).join("\n"):(val??""))}</textarea></label>`;
    if(f.type==="select")return `<label class="f" for="${id}">${esc(f.label)}<select id="${id}" ${req}><option value="" ${val==null||val===""?"selected":""} ${f.req?"disabled":""}>—</option>${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(val)===String(ov)?"selected":""}>${esc(ol)}</option>`}).join("")}</select></label>`;
    return `<label class="f" for="${id}">${esc(f.label)}${hint}<input type="${f.type||"text"}" id="${id}" ${req} value="${esc(val??"")}" placeholder="${esc(f.ph||"")}" ${f.max?`maxlength="${f.max}"`:""} ${f.im?`inputmode="${f.im}"`:""} ${f.type==="number"?(f.int?'inputmode="numeric" step="1"':'inputmode="decimal" step="any"'):""}></label>`};
  const field=f=>{const h=field0(f);return f.when?`<div data-when="${esc(f.when[0])}" data-eq="${esc(f.when[1])}">${h}</div>`:h};
  const rows=[];let i=0;const F=cfg.fields;while(i<F.length){if(F[i].half&&F[i+1]&&F[i+1].half){rows.push(`<div class="grid g2" style="gap:10px">${field(F[i])}${field(F[i+1])}</div>`);i+=2}else{rows.push(field(F[i]));i++}}
  $("#sheetroot").innerHTML=`<div class="sheet-back" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
   <div class="sheet-head"><h2 id="sh-title">${esc(cfg.title)}</h2><button class="btn icon" data-act="closeSheet" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
   <form class="sheet-body form" id="sheetform" novalidate>${cfg.intro?`<p class="small muted" style="margin:0">${cfg.intro}</p>`:""}${rows.join("")}</form>
   <div class="sheet-foot">${cfg.del?`<button class="btn del" data-act="sheetDelete">${TRASH}Delete</button>`:""}<span class="grow"></span><button class="btn" data-act="closeSheet">Cancel</button><button class="btn gold" type="submit" form="sheetform">${esc(cfg.button||"Save")}</button></div></div>`;
  $("#sheetform").onsubmit=async e=>{e.preventDefault();const out={};
    for(const f of cfg.fields){const el=$("#sf-"+f.key);let val;const w=el.closest("[data-when]");if(w&&w.hidden){out[f.key]=null;continue}
      if(f.type==="seg"&&f.req&&!el.value){const b=el.parentNode.querySelector("button");b&&b.focus();toast(f.label+" is required",true);return}
      if(f.type==="time"&&$("#sf-"+f.key+"-tba")&&$("#sf-"+f.key+"-tba").checked){out[f.key]="TBA";continue}
      if(f.type==="height"){const a=el.value,b=$("#"+el.id+"-in").value,orig=v[f.key];if(!a&&!b){out[f.key]=orig&&!parseHt(orig)?orig:"";continue}if(!a||!b){(a?$("#"+el.id+"-in"):el).focus();toast("Pick both feet and inches for "+f.label.toLowerCase(),true);return}out[f.key]=`${a}'${b}"`;continue}

    try{await cfg.onSave(out);closeSheet();toast(cfg.saved||"Saved")}catch(err){btn.disabled=false;toast(err.message||"Couldn't save",true)}};
  const sync=()=>{$$("#sheetform [data-when]").forEach(w=>{const c=$("#sf-"+w.dataset.when);w.hidden=!c||c.value!==w.dataset.eq});$$('#sheetform input[id$="-tba"]').forEach(c=>{const t=$("#"+c.id.slice(0,-4));if(t){t.disabled=c.checked;if(c.checked)t.value=""}})};
  $$("#sheetform [data-seg]").forEach(b=>b.onclick=()=>{$("#"+b.dataset.seg).value=b.dataset.v;$$(`#sheetform [data-seg="${b.dataset.seg}"]`).forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});sync()});
  $("#sheetform").addEventListener("change",sync);$("#sheetform").addEventListener("input",sync);sync();

function escClose(e){if(e.key==="Escape"&&!$("#cfmroot"))requestClose()}
const sheetDirty=()=>!!(sheetCfg&&$("#sheetform")&&formState()!==sheetInit);

function closeSheet(silent,viaPop){if(!$("#sheetroot").firstChild)return;if(ed&&ed.previewing){stopPlayback();ed.previewing=false}$("#sheetroot").innerHTML="";sheetCfg=null;document.removeEventListener("keydown",escClose);if(!silent&&!viaPop&&history.state&&history.state.sheet){suppressPop++;history.back()}const lf=lastFocus;lastFocus=null;const sel=lf&&lf.dataset&&lf.dataset.act?`[data-act="${lf.dataset.act}"]${lf.dataset.id?`[data-id="${lf.dataset.id}"]`:""}`:null;setTimeout(()=>{let t=lf&&lf.isConnected?lf:(sel?document.querySelector(sel):null);if(t)try{t.focus()}catch(e){}},60);if(!silent){if(pendingRender){pendingRender=false;render()}else render()}}

function gameRow(g){
  const o=O(g.opp);const isNext=g===nextGame()||(nextGame()&&g.id===nextGame().id);
  const right=g.played?`<span class="num"><span class="res ${g.res}">${g.res}</span><b>${scoreTxt(g)}</b></span>`:g.d<TODAY?`<span class="chip warn">Needs final score</span>`:(isNext?`<span class="chip gold">Up next</span>`:`<span class="muted small num">${esc(fmtTime(g.time))}</span>`);
  return `<div class="li ${isNext?"upnext":""}"><div class="date">${mon(g.d)}<b>${g.d.getDate()}</b></div><div><a class="opp" href="#opp-${esc(g.opp)}">${gTitle(g,o)}</a><div class="small muted">${dow(g.d)} · ${esc(siteText(g,o))} · ${isExh(g)?EXH_CHIP:g.lg?"League":"Non-league"} · ${g.played?(hasBox(g)?`<a href="#game-${g.date}">Box score</a>`:"Final"):`<a href="${NFHS_SCHOOL}" target="_blank" rel="noopener">Watch</a>`}</div></div><div class="right">${right}${isCoach()?`<button class="btn icon edit" data-act="editGame" data-id="${esc(g.id)}" aria-label="Edit game">${PEN}</button>`:""}</div></div>`;

function nextHero(){
  const g=nextGame();if(!g)return `<div class="card hero"><div class="eyebrow">Schedule</div><h2>No games scheduled</h2>${abtn("addGame","","Add a game")}</div>`;
  const o=O(g.opp);const days=Math.max(0,Math.floor((g.d-TODAY)/864e5));
  const st=o.status==="ready"?'<span class="chip good">Report ready</span>':o.status==="progress"?'<span class="chip warn">Report in progress</span>':'<span class="chip">Not scouted</span>';
  const lm=lastMet(o);
  return `<div class="card hero"><div class="eyebrow">Next game · ${gKind(g)}</div><h2>${gTitle(g,o)}</h2>
  <div class="meta">${[longDate(g.d),fmtTime(g.time),siteOf(g)==="home"?CONFIG.homeGym:siteOf(g)==="neutral"?(g.venue?"Neutral · "+g.venue:"Neutral site"):(o.city||"Away")].filter(Boolean).map(esc).join(" · ")}</div>
  ${heroPill(g,days)}${lm?`<span class="pill">Last met<b class="num">${lm.res} ${lm.us}–${lm.them}</b>${esc(lm.when)}</span>`:""}
  <div class="actions"><a class="btn gold" href="#opp-${esc(g.opp)}">Open scouting report</a><a class="btn ghost" href="${NFHS_SCHOOL}" target="_blank" rel="noopener">Watch on NFHS</a>${isCoach()?st:""}</div></div>`;
}
function heroPill(g,days){

const BSTATS=[["ppg","Points per game",""],["rpg","Rebounds per game",""],["apg","Assists per game",""],["spg","Steals per game",""],["bpg","Blocks per game",""],["tpp","3-point % (10+ attempts)","%"],["ftp","Free throw % (10+ attempts)","%"],["ts","True shooting % (20+ shots)","%"],["dd","Double-doubles (games)",""],["hi","Season-high points in a game",""]];
const bstat=k=>BSTATS.find(b=>b[0]===k)||BSTATS[0];
function metric(p,s,k){if(!s||!s.gp)return -1;
  if(k==="tpp")return s.tpa>=10?s.tpm/s.tpa*100:-1;if(k==="ftp")return s.fta>=10?s.ftm/s.fta*100:-1;if(k==="ts")return s.fga>=20?s.ts*100:-1;

function splitRow(line,del){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"'&&cur.trim()==="")q=true;else if(c===del){out.push(cur.trim());cur=""}else cur+=c}out.push(cur.trim());return out}
function csvDate(s){s=String(s||"").trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s),y,mo,d;if(m){y=+m[1];mo=+m[2];d=+m[3]}else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})$/.exec(s))){mo=+m[1];d=+m[2];y=+m[3]+(m[3].length===2?2000:0)}else return null;
  const iso=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");return realDate(iso)?iso:null}
function parseCSV(text){
  const L=String(text||"").replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(L.length<2)throw new Error("Add a header row and at least one player row.");
  const del=L[0].includes("\t")?"\t":",";const alias={"#":"no",jersey:"no",number:"no",date:"game"};
  const head=splitRow(L[0],del).map(x=>{x=x.trim().toLowerCase();return alias[x]||x});const miss=["game","no"].filter(n=>!head.includes(n));if(miss.length)throw new Error("Missing column"+(miss.length>1?"s":"")+": "+miss.join(", ")+".");
  const PL=players();const gs={},seen={},bad=new Set(),errs=[],blank=[];
  L.slice(1).forEach((ln,i)=>{const r=i+2;const v=splitRow(ln,del);const o={};head.forEach((h,j)=>o[h]=v[j]??"");
    const date=csvDate(o.game);if(!date){errs.push(`Row ${r}: can't read the date “${o.game}”. Use 11/21/2026 or 2026-11-21.`);return}
    const nice=mon(D(date))+" "+D(date).getDate();const g=games().find(x=>x.date===date);
    if(!g){errs.push(`Row ${r}: there's no game on ${nice} on the Schedule. Add the game first.`);return}
    if(!g.played){errs.push(`Row ${r}: Enter the final score for ${nice} on the Schedule first.`);return}
    const raw=String(o.no||"").replace(/^#/,"").trim();let p=PL.find(x=>String(x.no)===raw);
    if(!p&&/^\d+$/.test(raw)){const c=PL.filter(x=>/^\d+$/.test(String(x.no))&&+x.no===+raw);if(c.length===1)p=c[0]}
    if(!p){errs.push(`Row ${r}: no player wears #${raw||"(blank)"}.`);return}
    const sg=(seen[date]=seen[date]||{});if(sg[p.id]){errs.push(`${nice}: #${p.no} ${pName(p)} is listed twice (rows ${sg[p.id]} and ${r}). Fix the file. This game was not imported.`);bad.add(date);return}sg[p.id]=r;
    const l={id:p.id};KEYS.forEach(k=>l[k]=Math.max(0,parseInt(o[k],10)||0));
    if(String(o.min??"").trim()===""&&KEYS.some(k=>k!=="min"&&l[k]>0))blank.push(`#${p.no} ${pName(p)} (${nice})`);
    (gs[date]=gs[date]||[]).push(l)});
  bad.forEach(d=>delete gs[d]);
  const warns=blank.length?[`Minutes are blank for ${blank.join(", ")}. Those lines won't count as games played until minutes are entered.`]:[];
  return{games:gs,errs,warns};
}

  if(ph.cap!=null){const c=String(ph.cap).trim().slice(0,140);if(c)ph.cap=c;else delete ph.cap}
  if(k===0){delete ph.curve;delete ph.scrFor;delete ph.scrAng;return ph}const A=phs[k-1];
  if(ph.curve){for(const id of Object.keys(ph.curve)){const a=A.pos[id],b=ph.pos[id],c=curveOf(ph,id);if(!c||!a||!b||Math.hypot(b[0]-a[0],b[1]-a[1])<6)delete ph.curve[id]}if(!Object.keys(ph.curve).length)delete ph.curve}
  if(ph.scrAng){for(const id of Object.keys(ph.scrAng)){const g=ph.scrAng[id];if(!(ph.screens||[]).includes(id)||typeof g!=="number"||!isFinite(g))delete ph.scrAng[id];else ph.scrAng[id]=Math.round(g)}if(!Object.keys(ph.scrAng).length)delete ph.scrAng}
  if(ph.scrFor){for(const id of Object.keys(ph.scrFor)){const t=ph.scrFor[id];if(!(ph.screens||[]).includes(id)||!IDS.includes(t)||t===id)delete ph.scrFor[id]}if(!Object.keys(ph.scrFor).length)delete ph.scrFor}
  return ph})}
function builderHint(){

  if(ed.previewing)return "<b>Previewing the whole play.</b> Pause, scrub or change the speed. Tap <b>Back to editing</b> when you're done.";
  if(ed.mode==="move")return ed.cur===0?"<b>Step 1 · Starting spots.</b> Drag each player to where they line up. Then tap <b>+ Add step</b>.":`<b>Step ${ed.cur+1}.</b> Drag players to where they end up. Faded circles show where they were. Drag a gold dot to curve a path; double-tap it to straighten.`;
  if(ed.mode==="pass")return ed.cur===0?`<b>Who starts with the ball?</b> Tap a player. (Now: ${ph.ball})`:`<b>Pass in step ${ed.cur+1}.</b> Tap the player who catches it. Currently ${ph.ball} has the ball.`;
  if(ed.cur===0)return "Screens happen in a later step. Add a step first.";
  const sc=ph.screens||[];
  return `<b>Screens in step ${ed.cur+1}.</b> Drag a player to where he sets the screen. Then drag the gold dot to aim it (double-tap the dot to reset). Tap a screener to remove his screen.${sc.length?" Screening now: "+sc.join(", ")+".":""}`;
}

function confirmDiscard(onDiscard,title,body){
  const old=$("#cfmroot");if(old)old.remove();const prev=document.activeElement;
  const root=document.createElement("div");root.id="cfmroot";
  root.innerHTML=`<div class="cfm-back" data-x></div><div class="cfm" role="alertdialog" aria-modal="true" aria-labelledby="dc-t" style="border-color:var(--line)"><h2 id="dc-t">${esc(title||"Discard changes?")}</h2><p class="muted">${esc(body||"You have edits that haven't been saved.")}</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-x>Keep editing</button><button class="btn dangerfill" id="dc-go">Discard</button></div></div>`;
  document.body.appendChild(root);const close=()=>{root.remove();document.removeEventListener("keydown",k,true);if(prev&&prev.isConnected)prev.focus()};const k=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};document.addEventListener("keydown",k,true);
  root.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);root.querySelector("#dc-go").onclick=()=>{root.remove();document.removeEventListener("keydown",k,true);onDiscard()};setTimeout(()=>root.querySelector("[data-x].btn").focus(),40);
}
/* Keep keyboard focus inside the open dialog */
document.addEventListener("keydown",e=>{if(e.key!=="Tab")return;const box=$("#cfmroot .cfm")||$("#sheetroot .sheet");if(!box)return;const f=[...box.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];
  if(!box.contains(document.activeElement)){e.preventDefault();first.focus();return}if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;e.preventDefault();try{const r=fn(el.dataset,el);if(r&&r.catch)r.catch(err=>toast(err.message||"Something went wrong",true))}catch(err){if(err&&err.message)toast(err.message,true)}});

/* ================= Page bindings ================= */
function bindView(r){
  if(r==="stats"){
    $$("[data-tab]").forEach(b=>b.onclick=()=>{statTab=b.dataset.tab;render()});
    $$("[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort;statSort=statSort.k===k?{k,d:-statSort.d}:{k,d:k==="name"?1:-1};render()});
    const go=$("#csvgo");if(go){
      $("#csvfile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("#csvtext").value=rd.result};rd.readAsText(f)};
      let forceImport=false;
      $("#csvtext").oninput=()=>{forceImport=false};
      go.onclick=async()=>{importMsg="";try{const {games:gs,errs,warns}=parseCSV($("#csvtext").value);const ds=Object.keys(gs);if(!ds.length){$("#csvmsg").innerHTML=`<span style="color:var(--bad)">${errs.map(esc).join("<br>")||"Nothing to import."}</span>`;return}
        const bad=ds.map(d=>{const g=games().find(x=>x.date===d);const sum=gs[d].reduce((a,l)=>a+l.pts,0);const shot=gs[d].find(l=>l.fgm>l.fga||l.tpm>l.tpa||l.ftm>l.fta||l.tpm>l.fgm||l.pts!==2*(l.fgm-l.tpm)+3*l.tpm+l.ftm);return{d,g,sum,shot}}).filter(x=>x.sum!==+x.g.us||x.shot);
        if(bad.length&&!forceImport){forceImport=true;$("#csvmsg").innerHTML=`<span style="color:var(--warn)">${bad.map(x=>x.sum!==+x.g.us?`${esc(mon(x.g.d)+" "+x.g.d.getDate())}: player points add to ${x.sum}, but the final was ${x.g.us}.`:`${esc(mon(x.g.d)+" "+x.g.d.getDate())}: #${esc(P(x.shot.id).no)}'s shooting numbers don't add up to his points.`).join("<br>")}</span><br>Fix the file, or tap <b>Import</b> again to import anyway.`;return}forceImport=false;
        for(const d of ds)await saveDoc("statgames",d,{lines:gs[d],by:user.cid,ts:Date.now()});const g=games().find(x=>x.date===ds[0]);const sum=gs[ds[0]].reduce((a,l)=>a+l.pts,0);
        importMsg=`<span style="color:var(--good)">Imported ${ds.length} game${ds.length>1?"s":""}.</span>${sum!==+g.us?` <span style="color:var(--warn)">Player points add to ${sum}, but the final score was ${g.us}.</span>`:""}${errs.length?`<br><span style="color:var(--warn)">${errs.map(esc).join("<br>")}</span>`:""}${warns.length?`<br><span style="color:var(--warn)">${warns.map(esc).join("<br>")}</span>`:""}`;render();toast("Stats imported")}catch(e){$("#csvmsg").innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`}};
    }
  }
  if(r==="playbook")bindPlaybook();
  if(r==="glossary"){$$("[data-gtab]").forEach(b=>b.onclick=()=>{glossTab=b.dataset.gtab;render()});
    $$("[data-ggrp]").forEach(b=>b.onclick=()=>{glossGrp=glossGrp===b.dataset.ggrp?"":b.dataset.ggrp;render();const n=$(`[data-ggrp="${CSS.escape(glossGrp)}"]`);if(n){n.focus({preventScroll:true});n.scrollIntoView({block:"nearest",inline:"center"})}});
    $$("[data-gall]").forEach(b=>b.onclick=()=>{const open=b.dataset.gall==="open";$$("details.ggroup").forEach(d=>{open?glossOpen.add(d.dataset.grp):glossOpen.delete(d.dataset.grp)});render()});
    $$("details.ggroup").forEach(d=>d.addEventListener("toggle",()=>{if(glossQ.trim()||glossGrp)return;d.open?glossOpen.add(d.dataset.grp):glossOpen.delete(d.dataset.grp);const b=$("[data-gall]");if(b){const all=$$("details.ggroup").every(x=>x.open);b.dataset.gall=all?"close":"open";b.textContent=all?"Collapse all":"Expand all"}}));
    const q=$("#gq");if(q)q.oninput=()=>{glossQ=q.value;const pos=q.selectionStart;render();const n=$("#gq");n.focus();n.setSelectionRange(pos,pos)}}
}

/* ================= Plain website: remove any app install left from earlier versions ================= */
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.startsWith("eagles-hub")).forEach(k=>caches.delete(k))).catch(()=>{})}

/* Helper for Claude to add plays for the coaches (signed in as Coach): CPC.addPlay({name,cat,court,roles,notes,phases}) */
window.CPC={async addPlay(o){if(!user||!isCoach())throw new Error("Sign in as a coach first");if(!o||!String(o.name||"").trim()||!o.cat||!Array.isArray(o.phases)||o.phases.length<2)throw new Error("A play needs a name, a category and at least 2 steps");
  const dup=plays().find(p=>p.name.trim().toLowerCase()===String(o.name).trim().toLowerCase());if(dup)throw new Error("A play named "+dup.name+" already exists");
  const id=uid("pl");await saveDoc("plays",id,{name:String(o.name).trim().slice(0,80),cat:o.cat,court:o.court==="full"?"full":"half",roles:o.roles||{},notes:String(o.notes||"").slice(0,3000),phases:cleanPhases(o.phases),author:user.cid,ts:Date.now()});render();return id},
  /* CPC.addGames([{date:"YYYY-MM-DD",time:"19:00"|"7:00 PM"|"TBA",opp:"Opponent name",site?:"home"|"away"|"neutral",home?:bool,lg?:bool,
       type?:"exh",event?:"Jamboree",venue?:"Name (neutral site only)",city?}]) creates missing opponents; skips dates that already have a game */
  async addGames(list){needCoach();if(!Array.isArray(list))throw new Error("addGames needs an array of games");const out={added:[],skipped:[]};
    for(const g of list){if(!g||!realDate(g.date)||!String(g.opp||"").trim()||parseTime(g.time)===null)throw new Error("Bad game: "+JSON.stringify(g));
      if(games().find(x=>x.date===g.date)){out.skipped.push(g.date);continue}
      const exh=g.type==="exh";const oid=await cpcOpp(g.opp,{city:g.city,league:!exh&&!!g.lg});
      const site=["home","away","neutral"].includes(g.site)?g.site:(g.home?"home":"away");
      const obj=cpcGameExtras({date:g.date,time:parseTime(g.time),opp:oid,site,home:site==="home",lg:!exh&&!!g.lg},g);
      await saveDoc("games",uid("g"),obj);out.added.push(g.date)}
    render();return out},
  /* CPC.updateGame("YYYY-MM-DD",{time?,site?,lg?,type?:"exh"|"reg",event?,venue?,opp?:"Opponent name"}) -> true | false (no game that day) */
  async updateGame(date,patch){needCoach();const g=games().find(x=>x.date===date);if(!g)return false;patch=patch||{};
    const allowed=["time","site","lg","type","event","venue","opp"];const extra=Object.keys(patch).filter(k=>!allowed.includes(k));if(extra.length)throw new Error("updateGame can't change: "+extra.join(", "));
    const {d:_d,played:_p,res:_r,id:_i,...base}=g;const obj={...base};
    if("time" in patch){const t=parseTime(patch.time);if(t===null)throw new Error("Can't read the time “"+patch.time+"”. Use 19:00, 7:00 PM or TBA");obj.time=t}
    if("site" in patch){if(!["home","away","neutral"].includes(patch.site))throw new Error("site must be home, away or neutral");obj.site=patch.site}
    obj.site=siteOf(obj);obj.home=obj.site==="home";
    if("type" in patch){if(patch.type==="exh")obj.type="exh";else if(patch.type==null||patch.type==="reg"||patch.type==="")delete obj.type;else throw new Error('type must be "exh" or "reg"')}
    if("lg" in patch)obj.lg=!!patch.lg;
    if("opp" in patch){if(!String(patch.opp||"").trim())throw new Error("Opponent is required");obj.opp=await cpcOpp(patch.opp,{league:obj.type!=="exh"&&!!obj.lg})}
    const ext={event:"event" in patch?patch.event:obj.event,venue:"venue" in patch?patch.venue:obj.venue,type:obj.type};
    await saveDoc("games",g.id,cpcGameExtras(obj,ext));render();return true},
  /* CPC.removeGame("YYYY-MM-DD") -> true | false. Also removes that game's imported box score. */
  async removeGame(date){needCoach();const g=games().find(x=>x.date===date);if(!g)return false;if(store.statgames[g.date])await removeDoc("statgames",g.date);await removeDoc("games",g.id);render();return true},
  /* CPC.updateOpp("Opponent name",{name?,city?,league?}) -> opponent id */
  async updateOpp(name,patch){needCoach();const o=cpcFindOpp(name);if(!o)throw new Error("No opponent named "+name);patch=patch||{};
    const extra=Object.keys(patch).filter(k=>!["name","city","league"].includes(k));if(extra.length)throw new Error("updateOpp can't change: "+extra.join(", "));
    const obj={...o};if("name" in patch){const nm=String(patch.name||"").replace(/\s+/g," ").trim();if(!nm||!/[a-z]/i.test(nm)||nm.length>60)throw new Error("Opponent name needs 1 to 60 characters with a letter");const dp=oppDup(nm,o.id);if(dp)throw new Error("There's already an opponent named "+dp.name);obj.name=nm}
    if("city" in patch)obj.city=String(patch.city||"").replace(/\s+/g," ").trim().slice(0,60);if("league" in patch)obj.league=!!patch.league;
    await saveDoc("opps",o.id,obj);render();return o.id},
  /* CPC.removeOpp("Opponent name") -> true | false (not found). Refuses while any game points to it; removes its notes, clips, standings row and league results. */
  async removeOpp(name){needCoach();const o=cpcFindOpp(name);if(!o)return false;const gs=games().filter(g=>g.opp===o.id);
    if(gs.length)throw new Error(`${o.name} still has ${plural(gs.length,"game")} on the schedule (${gs.map(g=>g.date).join(", ")}). Remove those first.`);
    for(const x of items("notes").filter(n=>n.opp===o.id))await removeDoc("notes",x.id);for(const x of items("clips").filter(n=>n.opp===o.id))await removeDoc("clips",x.id);
    for(const r of items("lres").filter(r=>r.a===o.id||r.b===o.id))await removeDoc("lres",r.id);if(get("stand",o.id))await removeDoc("stand",o.id);
    await removeDoc("opps",o.id);render();return true},
  /* CPC.setOppHistory("Opponent name",[{date:"YYYY-MM-DD",site:"home"|"away"|"neutral",us,them,note?,src?,res?}]) replaces opps.last
     (past meetings, last two seasons only). Creates the opponent (status "none") if missing. -> opponent id */
  async setOppHistory(name,meetings){needCoach();if(!Array.isArray(meetings))throw new Error("meetings must be an array");const PS=pastSeasons();
    const clean=meetings.map((m,k)=>{const at=`Meeting ${k+1}`;if(!m||typeof m!=="object")throw new Error(at+" is not an object");
      if(!inPast2(m.date))throw new Error(`${at}: date must be YYYY-MM-DD in ${PS[1].label} or ${PS[0].label}`);
      if(!["home","away","neutral"].includes(m.site))throw new Error(`${at}: site must be home, away or neutral`);
      const us=Number(m.us),them=Number(m.them);if(![us,them].every(x=>Number.isInteger(x)&&x>=0&&x<=200))throw new Error(`${at}: scores must be whole numbers from 0 to 200`);
      if(us===them)throw new Error(`${at}: games can't end in a tie`);const res=us>them?"W":"L";if(m.res!=null&&m.res!==res)throw new Error(`${at}: res "${m.res}" doesn't match the score`);
      const r={date:m.date,site:m.site,us,them,res};const note=String(m.note||"").trim().slice(0,200);if(note)r.note=note;const src=String(m.src||"").trim().slice(0,40);if(src)r.src=src;return r});
    const seen=new Set();clean.forEach(r=>{const key=r.date;if(seen.has(key))throw new Error("Two meetings on "+key);seen.add(key)});
    clean.sort((a,b)=>a.date.localeCompare(b.date));const oid=await cpcOpp(name,{});const o=get("opps",oid);await saveDoc("opps",oid,{...o,last:clean});render();return oid},
  /* CPC.setTeamHistory([{season:"2025-26",w,l,lw,ll,finish?,coach?,notes?}]) -> number of seasons stored (whole numbers 0-40) */
  async setTeamHistory(seasons){needCoach();if(!Array.isArray(seasons))throw new Error("seasons must be an array");const out=[];for(const x of seasons)out.push(cleanSeasonRow(x,out));
    out.sort((a,b)=>b.season.localeCompare(a.season));await saveDoc("history","seasons",{seasons:out});render();return out.length}};
function needCoach(){if(!user||!isCoach())throw new Error("Sign in as a coach first")}
const cpcFindOpp=name=>{const nm=String(name||"").replace(/\s+/g," ").trim().toLowerCase();return nm?opps().find(o=>o.name.trim().toLowerCase()===nm):null};
async function cpcOpp(name,{city,league}){const nm=String(name||"").replace(/\s+/g," ").trim();if(!nm||nm.length>60||!/[a-z]/i.test(nm))throw new Error("Opponent name needs 1 to 60 characters with a letter");
  const o=cpcFindOpp(nm);if(o)return o.id;const oid=uid("o");await saveDoc("opps",oid,{name:nm,city:String(city||"").trim().slice(0,60),status:"none",league:!!league,coach:{},keys:[],players:[],last:[]});return oid}
/* Same rules as the game form: exhibitions are never league games; event only on exhibitions; venue only at neutral sites */
function cpcGameExtras(obj,src){const o={...obj};const exh=src.type==="exh";
  const ev=String(src.event||"").replace(/\s+/g," ").trim();if(ev.length>60)throw new Error("Event name must be 60 characters or fewer");
  const ven=String(src.venue||"").replace(/\s+/g," ").trim();if(ven.length>60)throw new Error("Venue must be 60 characters or fewer");
  if(exh){o.type="exh";o.lg=false;if(ev)o.event=ev;else delete o.event}else{delete o.type;delete o.event}
  if(o.site==="neutral"&&ven)o.venue=ven;else delete o.venue;return o}
render();initDb();
})();
