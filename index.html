    if(o.coach!=null){if(typeof o.coach!=="object"||Array.isArray(o.coach))throw new Error("coach must be an object");const bad=Object.keys(o.coach).filter(k=>!CK.includes(k));if(bad.length)throw new Error("Unknown coach fields: "+bad.join(", "));
      CK.forEach(k=>{const v=o.coach[k];if(v==null)return;const t=String(v).trim();if(!t)return;if(t.length>(["name","tenure","record"].includes(k)?80:2000))throw new Error("coach."+k+" is too long");if(coach[k]!==t){coach[k]=t;coachFields++}})}
    let list=o.replacePlayers?[]:[...(opp.players||[])];const added=[],skipped=[];
    if(o.players!=null){if(!Array.isArray(o.players))throw new Error("players must be an array");
      o.players.forEach((x,i)=>{const at="Player "+(i+1);if(!x||typeof x!=="object")throw new Error(at+" is not an object");
        const nm=String(x.name||"").replace(/\s+/g," ").trim();if(!nm||nm.length>60)throw new Error(at+": name needs 1 to 60 characters");
        const no=x.no==null?"":String(x.no).trim();if(no&&!/^\d{1,2}$/.test(no))throw new Error(at+": jersey must be 1 or 2 digits");
        const pos=String(x.pos||"").trim().toUpperCase();if(pos&&!POS.includes(pos))throw new Error(at+": pos must be one of "+POS.join(", "));
        const yr=String(x.yr||"").trim();const yrOk=YRS.find(y=>y.toLowerCase()===yr.toLowerCase());if(yr&&!yrOk)throw new Error(at+": yr must be one of "+YRS.join(", "));
        let ht=String(x.ht||"").trim();if(ht){const h=parseHt(ht);if(!h)throw new Error(at+": height must look like 6'2\"");ht=`${h[0]}'${h[1]}"`}
        const info=String(x.info||"").trim().slice(0,1000);
        if(list.some(p=>(no&&String(p.no??"")===no)||String(p.name||"").trim().toLowerCase()===nm.toLowerCase())){skipped.push(nm);return}
        const p={name:nm,no,pos,yr:yrOk||"",ht};if(info)p.info=info;list.push(p);added.push(nm)})}
    const obj={...opp,coach,players:list};
    const {id:_id,...clean}=obj;if(coachFields||added.length||o.replacePlayers)await saveDoc("opps",opp.id,clean);
    render();return{coachFields,playersAdded:added.length,playersSkipped:skipped,players:list.length}}};
function needCoach(){if(!user||!isCoach())throw new Error("Sign in as a coach first")}
const cpcFindOpp=name=>{const nm=String(name||"").replace(/\s+/g," ").trim().toLowerCase();return nm?opps().find(o=>o.name.trim().toLowerCase()===nm):null};
async function cpcOpp(name,{city,league}){const nm=String(name||"").replace(/\s+/g," ").trim();if(!nm||nm.length>60||!/[a-z]/i.test(nm))throw new Error("Opponent name needs 1 to 60 characters with a letter");
  const o=cpcFindOpp(nm);if(o)return o.id;const oid=uid("o");await saveDoc("opps",oid,{name:nm,city:String(city||"").trim().slice(0,60),status:"none",league:!!league,coach:{},keys:[],players:[],last:[]});return oid}
/* CPC.updateGame / removeGame target one game by date; when a date has several, pass {opp:"Name"} and/or {time:"5:20 PM"} */
function cpcPickGame(date,which){let L=games().filter(g=>g.date===date);if(which&&which.opp!=null){const o=cpcFindOpp(String(which.opp).replace(/\s+/g," ").trim());L=o?L.filter(g=>g.opp===o.id):[]}
  if(which&&which.time!=null){const t=parseTime(which.time);L=L.filter(g=>parseTime(g.time)===t)}
  if(L.length>1)throw new Error(`There are ${L.length} games on ${date} (${L.map(g=>O(g.opp).name).join(", ")}). Pass {opp:"Name"} or {time:"5:20 PM"} to pick one.`);return L[0]||null}
/* Same rules as the game form: exhibitions are never league games; event only on exhibitions; venue only at neutral sites */
function cpcGameExtras(obj,src){const o={...obj};const exh=src.type==="exh";
  const ev=String(src.event||"").replace(/\s+/g," ").trim();if(ev.length>60)throw new Error("Event name must be 60 characters or fewer");
  const ven=String(src.venue||"").replace(/\s+/g," ").trim();if(ven.length>60)throw new Error("Venue must be 60 characters or fewer");
  if(exh){o.type="exh";o.lg=false;if(ev)o.event=ev;else delete o.event}else{delete o.type;delete o.event}
  if(o.site==="neutral"&&ven)o.venue=ven;else delete o.venue;return o}
/* ===== Polish pass: scroll memory, sheet exit + drag-to-dismiss ===== */
(function(){
  const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* Per-route scroll memory (like iOS tabs); a new page starts at the top. Tapping the active tab scrolls to top. */
  const Y={};let cur=location.hash.slice(1)||"home";
  window.addEventListener("hashchange",()=>{const nx=location.hash.slice(1)||"home";const top=r=>r.split(/[\/-]/)[0];
    const y=(top(nx)===top(cur)&&nx.includes("/")&&cur.includes("/"))?scrollY:(Y[nx]||0); /* level toggles keep position */
    cur=nx;requestAnimationFrame(()=>scrollTo(0,y))},true);
  window.addEventListener("scroll",()=>{Y[cur]=scrollY},{passive:true});
  document.addEventListener("click",e=>{const a=e.target.closest(".tabbar a.on,.rail .nav a.on");if(a&&a.getAttribute("href")===location.hash){e.preventDefault();scrollTo({top:0,behavior:RM()?"auto":"smooth"})}});
  /* Lock page scroll while a sheet is open */
  const root=document.getElementById("sheetroot");
  new MutationObserver(()=>document.documentElement.classList.toggle("sheet-open",!!root.firstChild)).observe(root,{childList:true});
  /* Called from closeSheet() just before it empties #sheetroot: a clone animates out so app logic stays synchronous */
  window.ghostSheet=()=>{const skip=window.__noGhost;window.__noGhost=false;if(skip||RM()||!root.querySelector(".sheet"))return;
    const g=root.cloneNode(true);g.querySelectorAll("[id],[for],[form],[name]").forEach(e=>{e.removeAttribute("id");e.removeAttribute("for");e.removeAttribute("form");e.removeAttribute("name")});g.removeAttribute("id");g.className="sheet-ghost";g.setAttribute("aria-hidden","true");g.inert=true;
    const sh=root.querySelector(".sheet"),gs=g.querySelector(".sheet");if(sh.style.transform)gs.style.transform=sh.style.transform;
    document.body.appendChild(g);setTimeout(()=>g.remove(),320)};
  /* Drag the sheet header down to dismiss: 1:1 tracking, velocity projection, spring back */
  let d=null;
  root.addEventListener("pointerdown",e=>{if(innerWidth>820||e.button>0)return;const h=e.target.closest(".sheet-head");if(!h||e.target.closest("button,a,input,select"))return;
    const s=h.closest(".sheet");d={s,y0:e.clientY,y:0,t:performance.now(),v:0,id:e.pointerId};s.style.animation="none";s.style.transition="none";h.setPointerCapture(e.pointerId)});
  root.addEventListener("pointermove",e=>{if(!d||e.pointerId!==d.id)return;const now=performance.now();let y=e.clientY-d.y0;if(y<0)y=-Math.sqrt(-y)*2; /* rubber-band upward */
    const dt=Math.max(1,now-d.t);d.v=.8*((y-d.y)/dt)+.2*d.v;d.y=y;d.t=now;d.s.style.transform=`translateY(${y}px)`});
  const end=e=>{if(!d||e.pointerId!==d.id)return;const {s,y,v}=d;d=null;const H=s.offsetHeight;const proj=y+v*(.99/(1-.99)); /* decay 0.99/ms */
    if(y>8&&proj>H*.4&&!sheetDirty()){spring(s,y,H,v,()=>{window.__noGhost=true;requestClose()})}
    else{spring(s,y,0,v,()=>{s.style.transform="";});if(y>8&&proj>H*.4)requestClose()}};
  root.addEventListener("pointerup",end);root.addEventListener("pointercancel",end);
  function spring(el,from,to,v0,done){if(RM()){el.style.transform=`translateY(${to}px)`;return done()}
    const k=380,c=2*Math.sqrt(k); /* critically damped, mass 1 */ let x=from-to,v=v0*1000,last=performance.now();
    const step=now=>{const dt=Math.min(.032,(now-last)/1000);last=now;const a=-k*x-c*v;v+=a*dt;x+=v*dt;el.style.transform=`translateY(${to+x}px)`;
      if(Math.abs(x)<.5&&Math.abs(v)<20){el.style.transform=`translateY(${to}px)`;return done()}requestAnimationFrame(step)};requestAnimationFrame(step)}
})();

render();initDb();
})();
